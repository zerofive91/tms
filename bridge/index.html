<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하나님께 가는 다리</title>
<meta name="description" content="눌러 보고 끌어 보며 따라가는 일곱 장의 이야기 — 하나님께 가는 다리">
<meta property="og:type" content="website">
<meta property="og:title" content="하나님께 가는 다리">
<meta property="og:description" content="눌러 보고 끌어 보며 따라가는 일곱 장의 이야기">
<meta name="theme-color" content="#23263f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#eef2fb; --ink:#1d2a44; --card:#ffffff; --line:#d9e0ef; --sun:#ff8a3d; --sin:#ff5a6e; --pink:#e8607a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:#23263f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141b2e;--ink:#eef2fb;--card:#1e2740;--line:#2e3a5a}}
:root[data-theme="dark"]{--bg:#141b2e;--ink:#eef2fb;--card:#1e2740;--line:#2e3a5a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{word-break:keep-all;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#23263f;color:#fff;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;overflow:clip;background:#2b2f4d}
.jua{font-family:'Jua','Pretendard',sans-serif;font-weight:400}

/* ===== 장면 ===== */
#cam{position:absolute;inset:0}
#cam.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
#cam.shakeBig{animation:shakeBig .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-2px)}}
@keyframes shakeBig{10%{transform:translate(-10px,6px)}20%{transform:translate(12px,-8px)}30%{transform:translate(-12px,4px)}40%{transform:translate(9px,-6px)}55%{transform:translate(-6px,4px)}70%{transform:translate(4px,-2px)}85%{transform:translate(-2px,1px)}}
#scene{position:absolute;transform-origin:30% 36%}
#kb{position:absolute;inset:0;transform-origin:30% 36%;animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.04)}}
.layer{position:absolute;inset:0;width:100%;height:100%;opacity:0;user-select:none;-webkit-user-drag:none;pointer-events:none;transform-origin:50% 50%;display:none}
/* 폰 그래픽 메모리: 지금 컷 · 나가는 컷만 그림(32장을 모두 겹쳐 두면 뒤 장에서 깜박이고 글자가 사라짐) */
.layer.on{display:block}
.ov{position:absolute;pointer-events:none;z-index:100000}
#glow{left:30.2%;top:35.4%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,244,210,.5),rgba(255,205,150,.16) 35%,transparent 66%);mix-blend-mode:screen;animation:pulse 3.4s ease-in-out infinite;transition:opacity .8s}
#glow.off{opacity:0}
/* v14 4단계: 움직이는 장면 · 빛줄기 · 가장자리 어둡게 */
.mov{object-fit:cover;transition:opacity .9s ease}
#rays{width:220%;height:130%;transform:translateX(-50%);transform-origin:50% 0;background:repeating-conic-gradient(from 150deg at 50% 0%,rgba(255,240,200,0) 0deg 5deg,rgba(255,236,190,.2) 7deg 9deg,rgba(255,240,200,0) 11deg 17deg);mix-blend-mode:screen;opacity:0;transition:opacity 1.6s;-webkit-mask-image:radial-gradient(ellipse 50% 70% at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 50% 70% at 50% 0%,#000 20%,transparent 75%);animation:rays 10s ease-in-out infinite alternate}
#rays.on{opacity:.9}
@keyframes rays{to{transform:translateX(-50%) rotate(7deg)}}
#vig{z-index:10;opacity:1;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(8,8,24,.42))}
@keyframes pulse{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)}}
#dark{inset:0;background:linear-gradient(to bottom,rgba(8,10,28,0) 28%,rgba(8,10,28,.55) 55%,rgba(8,10,28,.95));opacity:0;transition:opacity 1.2s}
#crossGlow{left:61.5%;top:45.6%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);background:radial-gradient(circle,rgba(255,170,190,.65),rgba(255,120,150,.2) 40%,transparent 68%);mix-blend-mode:screen;opacity:0;transition:opacity .8s, transform 1.2s cubic-bezier(.2,.9,.3,1)}
#crossGlow.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#crossGlow.soft{opacity:.45;transform:translate(-50%,-50%) scale(1)}
#crossGlow.surge{animation:surge 1.1s ease-out}
#crossGlow.red{background:radial-gradient(circle,rgba(255,70,90,.75),rgba(200,30,60,.25) 40%,transparent 68%)}
#crossGlow.gold{background:radial-gradient(circle,rgba(255,236,170,.8),rgba(255,200,120,.25) 40%,transparent 68%)}
@keyframes surge{30%{opacity:1;filter:brightness(1.8)}}
#sin{left:50%;top:60%;transition:left .9s,top .9s,transform .7s cubic-bezier(.3,1.6,.5,1),opacity .8s;transform:translate(-50%,-50%);font-family:'Jua',sans-serif;font-size:calc(var(--u)*13);color:var(--sin);opacity:0;text-shadow:0 0 calc(var(--u)*3) rgba(255,60,90,.8)}
#sin.on{opacity:.62}
#sin.big{transform:translate(-50%,-50%) scale(1.5);opacity:.9}
#sin.pulse{animation:sinp .55s}
@keyframes sinp{40%{transform:translate(-50%,-50%) scale(1.35);opacity:1}}
#drop{left:11%;top:43%;width:50%;height:27%;border:3px dashed rgba(255,255,255,.95);border-radius:24px;background:rgba(255,255,255,.14);opacity:0;transition:opacity .2s, background .2s}
#drop.show{opacity:.7}
#drop.hot{opacity:1;background:rgba(255,255,255,.3)}
#fx{left:0;top:0;width:100%;height:100%}
#beam{left:61.5%;top:0;width:16%;height:46%;transform:translate(-50%,-110%);background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,200,215,.85) 70%,#fff);filter:blur(5px);border-radius:0 0 50% 50%;opacity:0}
#beam.drop{animation:beam .42s cubic-bezier(.7,0,.9,.5) forwards}
@keyframes beam{0%{opacity:1;transform:translate(-50%,-110%)}100%{opacity:1;transform:translate(-50%,0)}}
#doorLight{left:24.3%;top:12.5%;width:5%;height:88%;background:linear-gradient(to right,rgba(255,236,200,0),rgba(255,240,210,.95),rgba(255,236,200,0));filter:blur(6px);mix-blend-mode:screen;opacity:0}
#knob{left:36.5%;top:68.6%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,255,255,.95);background:rgba(255,240,200,.18);box-shadow:0 0 24px rgba(255,230,180,.7);pointer-events:auto;touch-action:none;cursor:grab;display:none;animation:knob 1.4s ease-in-out infinite}
#knob.show{display:block}
@keyframes knob{50%{box-shadow:0 0 40px rgba(255,230,180,1);background:rgba(255,240,200,.32)}}
.fullov{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{background:#fff;z-index:12}
#flash.go{animation:flash .9s ease-out}
#flash.gold{background:#ffe7a8}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#tomb{background:#07080f;z-index:11;transition:opacity 1.3s ease}
.sfx{position:absolute;z-index:100001;pointer-events:none;font-family:'Jua',sans-serif;font-size:calc(var(--u)*9);line-height:1;white-space:nowrap;--o:#3a2140;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px -2px var(--o),2px -2px var(--o),-2px 2px var(--o),0 7px 0 rgba(0,0,0,.28);
  animation:sfx 1.6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes sfx{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(0);opacity:1}18%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.18)}32%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) rotate(-8deg) scale(1)}}

/* ===== 위쪽 ===== */
.topui{position:absolute;left:0;right:0;top:0;z-index:20;padding:12px 16px 56px;background:linear-gradient(to bottom,rgba(22,24,48,.8),rgba(22,24,48,.42) 62%,transparent);pointer-events:none;transition:opacity .4s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{font-size:13px;font-weight:700;opacity:.88;border:0;background:none;color:inherit;padding:6px 0;text-align:left;cursor:pointer;pointer-events:auto;min-width:0}
.step{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.3;padding:0;margin:6px 0}  /* v15: 단추가 많고 글이 길면(영어 · 큰 글씨) 두 줄까지 — 그래도 넘치면 「3 / 7」(setStep), 전체 이름은 장 고르기 창에 */
.step:not(:empty)::after{content:' ▾';opacity:.7}
.tools{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prog{position:relative;display:flex;justify-content:space-between;margin-top:10px;height:22px;pointer-events:auto;--p:0%}
.prog::before,.prog::after{content:'';position:absolute;left:8px;right:8px;top:10px;height:2px;border-radius:1px;background:rgba(255,255,255,.25)}
.prog::after{right:auto;width:calc((100% - 16px) * var(--pf,0));background:#ffe3a3;box-shadow:0 0 8px rgba(255,227,163,.8);transition:width 1.2s cubic-bezier(.3,.8,.3,1)}
.prog button{position:relative;z-index:1;width:16px;height:22px;border:0;background:none;cursor:pointer;padding:0}
.prog button::before{content:'';position:absolute;left:3px;top:6px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s, box-shadow .3s}
.prog button.done::before,.prog button.cur::before{background:#ffe3a3;box-shadow:0 0 8px rgba(255,227,163,.9)}
.prog .walker{position:absolute;z-index:2;top:-9px;left:calc(8px + (100% - 16px) * var(--pf,0));font-size:18px;line-height:1;transform:translateX(-50%) scaleX(-1);transition:left 1.2s cubic-bezier(.3,.8,.3,1);pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,227,163,.8))}
.caption{margin-top:6px;transition:opacity .25s, transform .25s}
.caption.fade{opacity:0;transform:translateY(6px)}
.caption h1{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:23px;line-height:1.3;min-height:2.6em;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.caption p{font-size:14.5px;line-height:1.45;opacity:.9;min-height:1.45em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.app.cover .topui .step,.app.cover .prog,.app.cover .caption,.app.cover #resetBtn{visibility:hidden}

/* ===== v14: 보기 방식 · 장 고르기 · 길게 누르기 · 밀어 건너기 · 조용한 기도 · 다음 걸음 ===== */
.toast{position:absolute;left:50%;top:76px;z-index:60;transform:translate(-50%,-6px);max-width:calc(100% - 32px);background:rgba(20,22,44,.88);color:#fff;border-radius:14px;padding:9px 14px;font-size:13.5px;font-weight:700;line-height:1.45;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s, transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chlist{position:absolute;inset:0;z-index:70;background:rgba(14,16,34,.72);display:none;align-items:flex-start;justify-content:center;padding:64px 16px 16px}
.chlist.show{display:flex}
.chbox{width:100%;max-width:420px;background:var(--bg);color:var(--ink);border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:rise .35s both}
.chbox .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;font-weight:800;font-size:15px}
.chbox .hd button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chbox ol{list-style:none;display:grid;gap:7px}
.chbox ol button{width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 12px;font-size:14.5px;font-weight:700;line-height:1.4;cursor:pointer}
.chbox ol button[aria-current="step"]{border-color:var(--pink)}
.chbox ol button.done{opacity:.72}
.hold{position:absolute;left:50%;bottom:12%;z-index:25;width:92px;height:92px;transform:translateX(-50%);display:none;pointer-events:none}
.hold.show{display:block}
.hold svg{width:100%;height:100%;transform:rotate(-90deg)}
.hold circle{fill:none;stroke-width:7}
.hold .bg{stroke:rgba(255,255,255,.28)}
.hold .fg{stroke:#ffd6e0;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;filter:drop-shadow(0 0 8px rgba(255,180,200,.9))}
.hold .hand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:tap 1.1s ease-in-out infinite}
.hold.on .hand{animation:none;transform:scale(.9)}
.swipe{position:absolute;left:50%;bottom:10%;z-index:25;width:60px;height:150px;transform:translateX(-50%);display:none;pointer-events:none}
.swipe.show{display:block}
.swipe .rail{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(to top,rgba(255,255,255,.1),rgba(255,241,184,.7))}
.swipe .hand{position:absolute;left:50%;bottom:0;font-size:40px;transform:translateX(-50%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:swipeUp 1.6s ease-in-out infinite}
@keyframes swipeUp{0%{bottom:0;opacity:0}15%{opacity:1}80%{bottom:96px;opacity:1}100%{bottom:110px;opacity:0}}
.swipe.on .hand{animation:none;opacity:1}
.swipe .fill{position:absolute;left:50%;bottom:0;width:10px;margin-left:-5px;height:0;border-radius:5px;background:linear-gradient(to top,#fff1b8,#ffd6e0);box-shadow:0 0 14px rgba(255,236,170,.9)}
.quiet{position:absolute;left:16px;right:16px;top:24%;z-index:16;background:rgba(20,22,44,.78);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:22px 20px 18px;text-align:center;display:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.quiet.show{display:block;animation:rise .8s both}
.quiet p{font-size:16px;line-height:1.7;font-weight:600}
.quiet small{display:block;margin-top:12px;font-size:13px;opacity:.8;min-height:1.4em}
.quiet .breath{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle,rgba(255,241,184,.9),rgba(255,214,224,.35) 55%,transparent 70%);animation:breath 6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.35);opacity:.65}}
.quiet .mail{position:relative;height:46px;margin-top:12px}
.quiet .mail::before{content:"";position:absolute;left:14px;right:22px;top:50%;border-top:2px dashed rgba(255,255,255,.28)}
.quiet .trail{position:absolute;left:14px;top:50%;height:2px;margin-top:-1px;width:0;max-width:calc(100% - 36px);background:linear-gradient(to right,rgba(255,241,184,0),#fff1b8);box-shadow:0 0 8px #fff1b8}
.quiet .env{position:absolute;top:50%;left:0;font-size:24px;transform:translate(0,-50%) rotate(-8deg);transition:left .25s linear;filter:drop-shadow(0 0 6px rgba(255,241,184,.7))}
.quiet .env.fly{transition:left .9s cubic-bezier(.5,0,.3,1),transform .9s,opacity .9s .5s;transform:translate(0,-80%) scale(.4) rotate(10deg);opacity:0}
.quiet .sky{position:absolute;right:0;top:50%;font-size:26px;transform:translateY(-50%);animation:pulse2 2.4s ease-in-out infinite}
.quiet .sky.got{animation:got .9s ease-out}
@keyframes pulse2{50%{transform:translateY(-50%) scale(1.25)}}
@keyframes got{40%{transform:translateY(-50%) scale(2.1);filter:brightness(1.6)}}
.nextsteps{display:grid;gap:8px}
.nextsteps b{font-size:13px;opacity:.75;margin:2px 2px 0}
.nextsteps a,.nextsteps button{display:block;text-align:center;text-decoration:none;border:2px solid var(--pink);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 10px;font-weight:800;font-size:15px;cursor:pointer}
.nextsteps[hidden]{display:none}

/* ===== 게이지 ===== */
.gauge{position:absolute;left:22px;right:22px;top:31%;z-index:15;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .3s, transform .3s;pointer-events:none}
.gauge.show{opacity:1;transform:none}
.gauge .ic{font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.track{position:relative;flex:1;height:16px;border-radius:8px;border:2px solid #fff;background:rgba(20,22,45,.45);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.fill{height:100%;width:0;border-radius:6px;background:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.pct{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-family:'Jua',sans-serif;font-size:34px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.gauge.wobble .track{animation:wob .12s linear infinite}
@keyframes wob{50%{transform:translateX(2px) rotate(.6deg)}}
.gauge.broke .fill{background:var(--sin)!important}
.gauge.broke{animation:gdrop .8s ease-in forwards}
@keyframes gdrop{30%{transform:rotate(-4deg)}100%{transform:translateY(60px) rotate(8deg);opacity:0}}
.gauge.leak .track{animation:leak .5s ease-in-out infinite}
@keyframes leak{50%{box-shadow:0 0 0 4px rgba(255,90,110,.45)}}

/* ===== 가운데 패널들 ===== */
.chips{position:absolute;left:20px;right:20px;top:31%;z-index:16;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.chip{background:rgba(255,255,255,.93);color:#1d2a44;border-radius:999px;padding:11px 20px;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:chip .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes chip{from{transform:scale(.3);opacity:0}}
.prayer{position:absolute;left:16px;right:16px;top:25%;z-index:16;background:rgba(255,255,255,.93);color:#1d2a44;border-radius:22px;padding:20px 20px;font-size:15.5px;line-height:1.75;box-shadow:0 14px 34px rgba(0,0,0,.3);display:none}
.prayer.show{display:block;animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.cover-title{position:absolute;left:0;right:0;top:20%;z-index:18;text-align:center;display:none;pointer-events:none}
.app.cover .cover-title{display:block;animation:rise 1s both}
.cover-title b{font-family:'Jua',sans-serif;font-weight:400;font-size:44px;line-height:1.2;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.cover-title b span{display:inline-block;white-space:pre;opacity:0;animation:ltr 1s cubic-bezier(.2,.7,.2,1) forwards;text-shadow:0 0 22px rgba(255,226,170,.55),0 4px 18px rgba(0,0,0,.55)}
@keyframes ltr{from{opacity:0;transform:translateY(12px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.tap{position:absolute;left:50%;bottom:9%;z-index:25;font-size:46px;transform:translateX(-50%);display:none;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:tap 1.1s ease-in-out infinite}
.tap.show{display:block}
.app.cover .tap{bottom:150px}  /* v15: 표지에서는 언어 단추 위로 */
@keyframes tap{50%{transform:translate(-50%,-12px) scale(1.08)}}

/* ===== 아래 ===== */
.botui{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:56px 16px 14px;background:linear-gradient(to top,rgba(22,24,48,.84),rgba(22,24,48,.45) 62%,transparent);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.botui.hide{transform:translateY(115%)}
.panel{display:none;flex-direction:column;gap:10px}
.panel.on{display:flex}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:24px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:background .3s}
.dot.on{background:var(--sin)}
.grid{display:grid;gap:9px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.card,.opt{user-select:none;-webkit-user-select:none;background:rgba(255,255,255,.94);color:#1d2a44;border:0;border-radius:18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .12s, opacity .3s, filter .3s}
.card:active,.opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.card{padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .em{font-size:25px;line-height:1}
.card .nm{font-family:'Jua','Pretendard',sans-serif;font-size:16px;line-height:1.2;white-space:nowrap}
.card.row{flex-direction:row;justify-content:center;gap:8px;padding:12px 8px}
.grid>*{min-width:0}
.card.row .nm{white-space:normal;text-align:left}
.card.drag{touch-action:none;cursor:grab}
.card .sw{width:6px;height:22px;border-radius:3px}
.opt{font-family:'Jua','Pretendard',sans-serif;font-size:17px;line-height:1.25;padding:14px 8px;min-height:54px}
.ripple{position:absolute;z-index:30;pointer-events:none;border-radius:50%;border:3px solid rgba(255,236,170,.9);transform:translate(-50%,-50%) scale(.2);opacity:.95;animation:ripple 1.3s ease-out forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.floatem{position:absolute;z-index:31;pointer-events:none;font-size:34px;transform:translate(-50%,-50%);animation:floatem 1.5s ease-out forwards;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
@keyframes floatem{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.opt.lit{box-shadow:0 0 0 3px #ffe3a3,0 0 22px rgba(255,227,163,.85)}
@media (prefers-reduced-motion: reduce){.ripple,.floatem{animation-duration:.01s}}
.card.auto,.opt.auto{transform:scale(.95);box-shadow:0 0 0 3px #ffe3a3}
.card.used,.opt.used{opacity:.42;filter:grayscale(1);pointer-events:none}
.opt:disabled{opacity:.42;pointer-events:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:scale(1.08) rotate(-4deg);box-shadow:0 18px 30px rgba(0,0,0,.35)}
.ghost.back{transition:left .3s, top .3s, opacity .3s;opacity:0}
.icon-btn:focus-visible,.card:focus-visible,.opt:focus-visible,.btn:focus-visible,.flip:focus-visible,.prog button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ===== v14: 말씀 장면 — 장면 안에 말씀을 크게 띄우고 읽어 줌 ===== */
.vs{position:absolute;left:0;right:0;bottom:0;z-index:19;padding:84px 20px 26px;text-align:center;background:linear-gradient(to top,rgba(14,14,32,.92),rgba(14,14,32,.72) 60%,transparent);display:none;pointer-events:none}
.vs.show{display:block;animation:rise .8s both}
.vs .lead{font-family:'Jua','Pretendard',sans-serif;font-size:17px;line-height:1.4;color:#ffe3a3;margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.vs .lead:empty{display:none}
.vs .vt{font-size:19px;line-height:1.75;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.6);max-height:58vh;overflow:auto}
.vs .vt span{opacity:.32;transition:opacity .25s}.vs .vt span.on{opacity:1;text-shadow:0 0 14px rgba(255,214,140,.55),0 2px 10px rgba(0,0,0,.6)}
.vs .vt.nr span{opacity:.32}.vs .vt.nr span.on{opacity:1}
.vs .vref{margin-top:10px;font-size:14px;font-weight:800;color:#ffd6e0}
.vs .vmore{margin-top:14px;pointer-events:auto;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vs .vmore[hidden]{display:none}
.app.vsfull .caption{opacity:0}
.app.vson .tap{left:auto;right:14px;bottom:16px;font-size:30px;transform:none;animation:tapR 1.1s ease-in-out infinite}
@keyframes tapR{50%{transform:translateY(-8px)}}

/* ===== 말씀 창 ===== */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--bg);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.3);padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px;transform:translateY(110%);transition:transform .55s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:translateY(0)}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.verses{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.verses::-webkit-scrollbar{display:none}
.flip{flex:0 0 100%;scroll-snap-align:center;perspective:1000px;height:206px;cursor:pointer;border:0;background:none;text-align:left}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.front{color:#fff;align-items:center;text-align:center;gap:6px}
.front b{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:23px}
.front span{font-size:14px;opacity:.92}
.front small{font-size:12px;opacity:.8;margin-top:4px}
.back{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:14.5px;line-height:1.6;overflow:auto;justify-content:flex-start}
.back .txt{margin:auto 0}
.back .ref{margin-top:6px;font-weight:800;color:var(--pink);font-size:14px}
.vdots{display:flex;gap:6px;justify-content:center}
.vdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .25s, width .25s}
.vdots i.on{background:var(--ink);width:18px;border-radius:4px}
.btns{display:grid;gap:10px}
.btn{border:0;border-radius:16px;padding:15px 10px;font-weight:800;font-size:15.5px;cursor:pointer}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.main{background:var(--ink);color:var(--bg)}

/* 암송 Festival 에서 덧붙인 것 — 보낸 사람 이름 한 줄 · 앱 안에서 닫기 */
.cover-title .from{display:block;margin-top:16px;font-size:16px;font-weight:700;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.langs{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:19;display:none;text-align:center}
.app.cover .langs{display:block;animation:rise 1s .6s both}
.lbtns,.langrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.lbtns button{border:1.5px solid rgba(255,255,255,.5);background:rgba(20,22,44,.5);color:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}
.lbtns button.on{background:#fff;color:#23263f;border-color:#fff}
.langs .credit{margin-top:8px;font-size:10px;line-height:1.35;opacity:.75;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.langrow{justify-content:flex-start;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.langrow button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.langrow button.on{border-color:var(--pink)}
.chbox .credit{margin-top:8px;font-size:11px;line-height:1.4;opacity:.7}
.credit[hidden]{display:none}
:lang(zh) *,:lang(ja) *,:lang(vi) *{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','PingFang SC','Hiragino Sans','Noto Sans SC','Noto Sans JP',sans-serif!important}
:lang(zh) body,:lang(ja) body{word-break:normal;line-break:strict}
:lang(vi) .card .nm{white-space:normal;font-size:14px;text-align:center}
:lang(zh) :is(.jua,#sin,.sfx,.caption h1,.pct,.cover-title b,.card .nm,.opt,.vs .lead,.front b),:lang(ja) :is(.jua,#sin,.sfx,.caption h1,.pct,.cover-title b,.card .nm,.opt,.vs .lead,.front b),:lang(vi) :is(.jua,#sin,.sfx,.caption h1,.pct,.cover-title b,.card .nm,.opt,.vs .lead,.front b){font-weight:800}
.cover-title .from[hidden],.icon-btn[hidden]{display:none}
/* v14 나레이션: 읽는 자리를 따라 글자가 밝아짐 */
.nr span{opacity:.5;transition:opacity .12s}.nr span.on{opacity:1}
.icon-btn.off{opacity:.55}
@media (prefers-reduced-motion: reduce){.nr span{transition:none}}
@media (max-height:640px){.caption h1{font-size:20px}.card{padding:8px 4px 7px}.card .em{font-size:21px}.opt{min-height:46px;padding:10px 8px}.flip{height:170px}}
@media (prefers-reduced-motion: reduce){#rays{animation:none}.cover-title b span{animation:none;opacity:1}.vs .vt span{transition:none}.prog::after,.prog .walker{transition:none}#kb,#glow,.tap,#knob,.hold .hand,.swipe .hand,.quiet .breath{animation:none}#cam.shake,#cam.shakeBig{animation:none}#flash.go{animation:none}}
</style>

  ,zh:{"TITLE": "通往神的桥", "STEPS": ["", "1. 神的礼物：永生", "2. 你的光景", "3. 人的努力无法得救", "4. 神为你所做的", "5. 怎样才能得着永生？", "6. 什么是信心？", "7. 你必须选择"], "T": {"c1": {"title": "对你来说，最宝贵的是什么？", "sub": "点一点卡片，把幸福装满吧。", "empty": "就算拥有一切，心里还是空空的。为什么呢？", "fellow": "神起初造人，是为了与我们亲密相交。", "crack": "但是因为我们犯了罪，罪进来了，我们和神的关系就断了。", "gap": "如今，人与神之间有了一道深深的鸿沟。"}, "c2": {"title": "神这样告诉我们自己的光景。", "sub": "依次点一点这三张卡片。", "end": "这就是与神隔绝的人的光景。"}, "c3": {"title": "靠自己的力量能到神那里吗？", "sub": "把卡片拖到悬崖之间，也可以直接点一下。", "building": "正在搭桥……", "tryOther": "再试试别的卡片吧。", "endTitle": "人的力量无法跨越这道鸿沟。", "endSub": "那么，难道就没有办法了吗？"}, "c4": {"title": "这里有神为你预备的解决办法。", "bridge": "耶稣基督成了通往神的桥。", "sub": "一个一个点一点耶稣所做的事。", "end": "如今，通往神的路已经打开了。"}, "c5": {"title": "桥已经架好，神也给了应许。", "sub": "依次点“听”和“信”，走过这座桥吧。", "promise": "神向相信的人这样应许。"}, "c6": {"title": "那么，怎样才算是相信呢？", "sub": "你听到敲门声了吗？拉一下门把手，把门打开吧。", "open": "现在你就可以敞开心门，接待耶稣基督进来。", "pray": "我们一起用心来祷告好吗？"}, "c7": {"title": "你现在在哪一边？", "here": "要在哪里度过永恒，需要你自己决定。", "think": "桥已经架好了，只要迈出一步就可以。", "there": "你已经接待耶稣进入你心里了吗？那么，他现在在哪里呢？"}, "c4x": {"hold": "长按屏幕试试。"}, "c5x": {"swipe": "向上滑动，走过这座桥吧。"}, "c6x": {"quiet": "现在，花一点时间，把心里的话直接告诉神吧。", "quietWait": "慢慢祷告也没关系。", "quietEnd": "说完了就点一下屏幕。", "sent": "你的祷告已经传到神那里了"}, "c7x": {"next": "下一步", "app1": "背诵得救确据的经文", "app2": "默想今天的经文", "web": "从“话语之手”开始"}, "c6y": {"easy": "并不难，只要相信就可以。", "pray": "祷告"}, "c7y": {"cong": "恭喜你！现在你已经成为神的儿女了。", "joy": "你回到神身边，神比谁都更欢喜。"}, "view": {"together": "操作模式 · 点屏幕往下走，亲手试一试", "alone": "播放模式 · 像视频一样自动播放", "chapters": "选择章节"}, "verseFront": "用圣经来确认", "verseHint": "点卡片翻过来看看", "swipe": "左右滑动看看", "more": "更多经文", "close": "关闭"}, "SFX": {"collapse": "哗啦！", "impact": "轰！", "glow": "唰！", "sparkle": "闪闪"}, "BTN": {"next": "下一步", "again": "再试一次", "restart": "从头开始", "prayer": "再看一次祷告文"}, "C1": [{"nm": "金钱"}, {"nm": "名誉"}, {"nm": "学问"}, {"nm": "享乐"}], "C2": [{"label": "1. 罪人", "head": "1. 你是罪人", "text": "因为世人都犯了罪，亏缺了 神的荣耀。", "ref": "罗马书 3:23"}, {"label": "2. 审判", "head": "2. 你将要受审判", "text": "按着定命，人人都有一死，死后且有审判。", "ref": "希伯来书 9:27"}, {"label": "3. 死亡", "head": "3. 刑罚就是死亡，也就是地狱", "text": "惟有胆怯的、不信的、可憎的、杀人的、淫乱的、行邪术的、拜偶像的，和一切说谎话的，他们的分就在烧着硫磺的火湖里；这是第二次的死。", "ref": "启示录 21:8"}], "C3": {"good": {"name": "善行", "q": "多做善事，就能到神那里吗？", "fail": "善事固然可贵，却填不满罪的鸿沟。"}, "religion": {"name": "宗教生活", "q": "热心过宗教生活，就能到神那里吗？", "fail": "宗教生活也填不满罪的鸿沟。"}, "moral": {"name": "道德努力", "q": "努力正直地生活，就能到神那里吗？", "fail": "离得最近，但还是到不了。"}, "edu": {"name": "教育·哲学", "q": "多学习、多思考，就能到神那里吗？", "fail": "人的智慧无法认识神。"}}, "C4": [{"label": "为你的罪死了"}, {"label": "被埋葬"}, {"label": "第三天复活"}], "C5": [{"label": "听"}, {"label": "信"}], "PROMISES": ["就有永生（现在）", "不至于定罪（未来）", "是已经出死入生了（过去）"], "C7": [{"label": "还在这一边"}, {"label": "还在考虑"}, {"label": "我已经过去了"}], "PRAYER": "神啊，我承认我是个罪人。我相信并感谢耶稣爱我，替我担当了罪，被钉死在十字架上，又复活了。现在我相信耶稣是我的救主，接待他进入我的心。求你进入我的心，引导我的人生。奉耶稣的名祷告，阿们。", "V": {"mk836": {"ref": "马可福音 8:36", "text": "人就是赚得全世界，赔上自己的生命，有什么益处呢？"}, "is646": {"ref": "以赛亚书 64:6", "text": "所有的义都像污秽的衣服。"}, "ep289": {"ref": "以弗所书 2:8-9", "text": "你们得救是本乎恩，也因着信；这并不是出于自己，乃是 神所赐的；也不是出于行为，免得有人自夸。"}, "je179": {"ref": "耶利米书 17:9", "text": "人心比万物都诡诈，坏到极处。"}, "co121": {"ref": "哥林多前书 1:21", "text": "世人凭自己的智慧，既不认识 神。"}, "pr1412": {"ref": "箴言 14:12", "text": "有一条路，人以为正，至终成为死亡之路。"}, "ro58": {"ref": "罗马书 5:8", "text": "惟有基督在我们还作罪人的时候为我们死， 神的爱就在此向我们显明了。"}, "co1534": {"ref": "哥林多前书 15:3-4", "text": "我当日所领受又传给你们的：第一，就是基督照圣经所说，为我们的罪死了，而且埋葬了；又照圣经所说，第三天复活了。"}, "jn146": {"ref": "约翰福音 14:6", "text": "我就是道路、真理、生命；若不藉着我，没有人能到父那里去。"}, "jn524": {"ref": "约翰福音 5:24", "text": "我实实在在地告诉你们，那听我话、又信差我来者的，就有永生；不至于定罪，是已经出死入生了。"}, "jn112": {"ref": "约翰福音 1:12", "text": "凡接待他的，就是信他名的人，他就赐他们权柄作 神的儿女。"}, "re320": {"ref": "启示录 3:20", "text": "看哪，我站在门外叩门，若有听见我声音就开门的，我要进到他那里去，我与他，他与我一同坐席。"}, "jn336": {"ref": "约翰福音 3:36", "text": "信子的人有永生；不信子的人得不着永生， 神的震怒常在他身上。"}, "ro245": {"ref": "罗马书 2:4-5", "text": "还是你藐视他丰富的恩慈、宽容、忍耐，不晓得他的恩慈是领你悔改呢？你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致 神震怒，显他公义审判的日子来到。"}, "zp317": {"ref": "西番雅书 3:17", "text": "耶和华－你的 神是施行拯救、大有能力的主。他在你中间必因你欢欣喜乐，默然爱你，且因你喜乐而欢呼。"}, "jo51113": {"ref": "约翰一书 5:11-13", "text": "这见证就是 神赐给我们永生；这永生也是在他儿子里面。人有了 神的儿子就有生命，没有 神的儿子就没有生命。我将这些话写给你们信奉 神儿子之名的人，要叫你们知道自己有永生。"}}, "U": {"narrOff": "关闭旁白", "narrOn": "打开旁白", "narrOnT": "旁白已打开", "narrOffT": "旁白已关闭", "sndOff": "关闭声音", "sndOn": "打开声音", "from": "{n} 送给你", "flip": "翻开第 {n} 张经文卡", "mode": "观看方式", "reset": "重看这一章", "close": "关闭", "knob": "门把手", "lang": "语言", "sin": "罪", "sin": "罪", "credit": "圣经经文引自《和合本》（新标点和合本，神版）。"}}
  ,vi:{"TITLE": "Cây cầu đến với Đức Chúa Trời", "STEPS": ["", "1. Món quà của Đức Chúa Trời: sự sống vĩnh cửu", "2. Tình trạng của bạn", "3. Sức con người không thể cứu", "4. Điều Đức Chúa Trời đã làm cho bạn", "5. Làm sao để có sự sống vĩnh cửu?", "6. Đức tin là gì?", "7. Bạn phải lựa chọn"], "T": {"c1": {"title": "Điều gì quý giá nhất đối với bạn?", "sub": "Chạm vào các thẻ để lấp đầy hạnh phúc.", "empty": "Dù có tất cả, lòng vẫn trống rỗng. Vì sao vậy?", "fellow": "Ban đầu, Đức Chúa Trời tạo nên con người để sống gắn bó với Ngài.", "crack": "Nhưng vì chúng ta phạm tội, tội lỗi đã xen vào và cắt đứt mối liên hệ giữa chúng ta với Đức Chúa Trời.", "gap": "Giờ đây, giữa con người và Đức Chúa Trời có một khoảng cách sâu thẳm."}, "c2": {"title": "Đức Chúa Trời cho chúng ta thấy tình trạng của mình như thế này.", "sub": "Lần lượt chạm vào ba thẻ.", "end": "Đây là tình trạng của con người khi xa cách Đức Chúa Trời."}, "c3": {"title": "Tôi có thể tự mình đến với Đức Chúa Trời không?", "sub": "Kéo một thẻ vào khoảng trống giữa hai vách đá. Chạm vào cũng được.", "building": "Đang bắc cầu...", "tryOther": "Hãy thử thẻ khác nữa.", "endTitle": "Sức con người không thể vượt qua khoảng cách này.", "endSub": "Vậy là không còn cách nào sao?"}, "c4": {"title": "Đây là giải pháp Đức Chúa Trời dành cho bạn.", "bridge": "Chúa Giê-xu, Đấng Cứu Thế, đã trở thành cây cầu đến với Đức Chúa Trời.", "sub": "Chạm vào từng việc Chúa Giê-xu đã làm.", "end": "Giờ đây, con đường đến với Đức Chúa Trời đã mở ra."}, "c5": {"title": "Cây cầu đã được bắc, và Đức Chúa Trời đã ban lời hứa.", "sub": "Lần lượt chạm “Nghe” và “Tin” để đi qua cầu.", "promise": "Đức Chúa Trời đã hứa như vậy với người tin."}, "c6": {"title": "Vậy tin là như thế nào?", "sub": "Bạn có nghe tiếng gõ cửa không? Kéo tay nắm để mở cửa.", "open": "Ngay bây giờ, bạn có thể mở cửa lòng và mời Chúa Giê-xu, Đấng Cứu Thế, vào.", "pray": "Chúng ta cùng thành tâm cầu nguyện nhé?"}, "c7": {"title": "Bây giờ bạn đang ở phía nào?", "here": "Bạn phải tự quyết định mình sẽ ở đâu trong cõi đời đời.", "think": "Cây cầu đã được bắc sẵn. Chỉ cần bước một bước thôi.", "there": "Bạn đã mời Chúa Giê-xu vào lòng chưa? Nếu rồi, bây giờ Ngài đang ở đâu?"}, "c4x": {"hold": "Hãy nhấn giữ màn hình."}, "c5x": {"swipe": "Vuốt lên để đi qua cầu."}, "c6x": {"quiet": "Bây giờ, hãy dành một chút thời gian nói với Đức Chúa Trời điều lòng bạn muốn nói.", "quietWait": "Cứ cầu nguyện thong thả nhé.", "quietEnd": "Khi xong, hãy chạm vào màn hình.", "sent": "Lời cầu nguyện của bạn đã đến với Đức Chúa Trời"}, "c7x": {"next": "Bước tiếp theo", "app1": "Học thuộc câu Kinh Thánh về sự bảo đảm cứu rỗi", "app2": "Suy ngẫm câu Kinh Thánh hôm nay", "web": "Bắt đầu với Bàn tay Lời Chúa"}, "c6y": {"easy": "Không khó đâu. Chỉ cần tin thôi.", "pray": "Cầu nguyện"}, "c7y": {"cong": "Chúc mừng bạn! Giờ đây bạn đã trở thành con của Đức Chúa Trời.", "joy": "Đức Chúa Trời vui mừng hơn ai hết vì bạn đã trở về với Ngài."}, "view": {"together": "Chế độ thao tác · Chạm để chuyển tiếp và tự mình thử", "alone": "Chế độ phát · Tự động chuyển như xem video", "chapters": "Chọn chương"}, "verseFront": "Xem trong Kinh Thánh", "verseHint": "Chạm vào thẻ để lật", "swipe": "Vuốt sang ngang", "more": "Xem thêm câu Kinh Thánh", "close": "Đóng"}, "SFX": {"collapse": "Rầm!", "impact": "Ầm!", "glow": "Vụt!", "sparkle": "Lấp lánh"}, "BTN": {"next": "Bước tiếp", "again": "Thử lại", "restart": "Bắt đầu lại", "prayer": "Xem lại lời cầu nguyện"}, "C1": [{"nm": "Tiền bạc"}, {"nm": "Danh vọng"}, {"nm": "Học vấn"}, {"nm": "Thú vui"}], "C2": [{"label": "1. Tội nhân", "head": "1. Bạn là người có tội", "text": "Vì mọi người đều phạm tội; tất cả chúng ta đều thiếu hụt vinh quang Đức Chúa Trời.", "ref": "Rô-ma 3:23"}, {"label": "2. Phán xét", "head": "2. Bạn sẽ bị phán xét", "text": "Theo như đã định, mỗi người chỉ chết một lần rồi bị Chúa xét xử.", "ref": "Hê-bơ-rơ 9:27"}, {"label": "3. Sự chết", "head": "3. Hình phạt là sự chết, tức là địa ngục", "text": "Còn những người hèn nhát, vô tín, hư hỏng, sát nhân, gian dâm, tà thuật, thờ thần tượng, và dối trá, đều phải vào hồ lửa diêm sinh. Đó là chết lần thứ hai.", "ref": "Khải Huyền 21:8"}], "C3": {"good": {"name": "Việc thiện", "q": "Làm nhiều việc thiện có giúp tôi đến với Đức Chúa Trời không?", "fail": "Việc thiện thật quý, nhưng không lấp được khoảng cách của tội lỗi."}, "religion": {"name": "Tôn giáo", "q": "Siêng năng giữ đạo có giúp tôi đến với Đức Chúa Trời không?", "fail": "Tôn giáo cũng không lấp được khoảng cách của tội lỗi."}, "moral": {"name": "Đạo đức", "q": "Cố gắng sống ngay thẳng có giúp tôi đến với Đức Chúa Trời không?", "fail": "Đã đến gần nhất, nhưng vẫn không tới được."}, "edu": {"name": "Học thức", "q": "Học nhiều và suy nghĩ sâu có giúp tôi đến với Đức Chúa Trời không?", "fail": "Khôn ngoan của con người không thể biết được Đức Chúa Trời."}}, "C4": [{"label": "Chịu chết vì tội của bạn"}, {"label": "Được chôn"}, {"label": "Sống lại vào ngày thứ ba"}], "C5": [{"label": "Nghe"}, {"label": "Tin"}], "PROMISES": ["được sự sống vĩnh cửu (hiện tại)", "không bị kết tội (tương lai)", "đã thoát chết mà vào cõi sống (quá khứ)"], "C7": [{"label": "Vẫn ở bên này"}, {"label": "Đang suy nghĩ"}, {"label": "Tôi đã qua cầu"}], "PRAYER": "Lạy Đức Chúa Trời, con nhận mình là người có tội. Con tin và cảm tạ Chúa vì Chúa Giê-xu đã yêu con, gánh tội thay con, chịu chết trên cây thập tự và đã sống lại. Giờ đây con tin Chúa Giê-xu là Đấng Cứu Rỗi của con và mời Ngài vào lòng con. Xin Chúa ngự vào lòng con và dẫn dắt cuộc đời con. Con cầu nguyện trong danh Chúa Giê-xu. A-men.", "V": {"mk836": {"ref": "Mác 8:36", "text": "Nếu một người chiếm được cả thế giới nhưng mất linh hồn thì có ích gì?"}, "is646": {"ref": "Y-sai 64:6", "text": "Khi chúng con bày tỏ công chính mình, chúng chẳng khác gì miếng giẻ, bẩn thỉu."}, "ep289": {"ref": "Ê-phê-sô 2:8-9", "text": "Vậy anh chị em được cứu nhờ ơn phước Đức Chúa Trời, do đức tin nơi Chúa Cứu Thế. Sự cứu rỗi là tặng phẩm của Đức Chúa Trời, chứ không do anh chị em tự tạo. Không phải là kết quả của công đức anh chị em, nên chẳng ai có thể khoe khoang."}, "je179": {"ref": "Giê-rê-mi 17:9", "text": "Lòng người gian dối hơn mọi vật, liều lĩnh gian ác."}, "co121": {"ref": "1 Cô-rinh-tô 1:21", "text": "Thế gian chỉ cậy khôn ngoan riêng của mình, không nhờ khôn ngoan của Đức Chúa Trời để nhận biết Ngài."}, "pr1412": {"ref": "Châm Ngôn 14:12", "text": "Con đường bạn chọn có vẻ phải, nhưng cuối nẻo đường là hố diệt vong."}, "ro58": {"ref": "Rô-ma 5:8", "text": "Nhưng Đức Chúa Trời đã chứng tỏ tình yêu thương Ngài đối với chúng ta, khi Chúa Cứu Thế chịu chết thay chúng ta là người tội lỗi."}, "co1534": {"ref": "1 Cô-rinh-tô 15:3-4", "text": "Trước hết, tôi truyền lại cho anh chị em những chân lý tôi đã tin nhận: Chúa Cứu Thế chịu chết vì tội chúng ta theo lời Thánh Kinh. Chúa được chôn, qua ngày thứ ba Ngài sống lại theo lời Thánh Kinh."}, "jn146": {"ref": "Giăng 14:6", "text": "Ta là con đường, chân lý, và nguồn sống. Nếu không nhờ Ta, không ai được đến với Cha."}, "jn524": {"ref": "Giăng 5:24", "text": "Ta quả quyết với các ông, ai nghe lời Ta mà tin Đức Chúa Trời, Đấng đã sai Ta thì được sự sống vĩnh cửu. Người ấy không bị kết tội, nhưng đã thoát chết mà vào cõi sống."}, "jn112": {"ref": "Giăng 1:12", "text": "Tuy nhiên, tất cả những người tiếp nhận Chúa đều được quyền làm con cái Đức Chúa Trời—tiếp nhận Chúa là đặt niềm tin nơi Chúa."}, "re320": {"ref": "Khải Huyền 3:20", "text": "Này! Ta đứng bên ngoài gõ cửa, nếu ai nghe tiếng Ta mà mở cửa ra, Ta sẽ vào thăm, ăn tối với người, chỉ người với Ta."}, "jn336": {"ref": "Giăng 3:36", "text": "Ai tin Con Đức Chúa Trời đều được sự sống vĩnh cửu, còn ai không vâng phục Ngài chẳng được sự sống ấy mà còn mang án phạt của Đức Chúa Trời."}, "ro245": {"ref": "Rô-ma 2:4-5", "text": "Hay anh chị em coi thường lòng nhân từ, khoan dung, nhẫn nại vô biên của Đức Chúa Trời đối với anh chị em? Điều đó không có ý nghĩa nào với anh chị em sao? Hay không nhận thấy Ngài nhân từ vì chờ đợi anh chị em hối cải? Ngoan cố, không hối cải là tự dồn chứa hình phạt khủng khiếp cho mình trong ngày đoán phạt của Đức Chúa Trời, khi Ngài dùng công lý xét xử loài người."}, "zp317": {"ref": "Sô-phô-ni 3:17", "text": "Vì Chúa Hằng Hữu, Đức Chúa Trời của ngươi, đang ngự giữa ngươi. Ngài đầy quyền năng giải cứu. Ngài sẽ vui mừng vì ngươi, tình yêu Ngài sẽ cho ngươi yên tĩnh. Ngài sẽ hát mừng vì yêu mến ngươi."}, "jo51113": {"ref": "1 Giăng 5:11-13", "text": "Đức Chúa Trời đã tuyên bố Ngài ban cho chúng ta sự sống vĩnh cửu và Chúa Cứu Thế là Nguồn Sống. Ai tiếp nhận Con Đức Chúa Trời mới có sự sống. Ai khước từ Con Đức Chúa Trời làm sao có sự sống được? Tôi viết điều đó để anh chị em biết rõ nhờ tin Con Đức Chúa Trời mà anh chị em được sống vĩnh cửu."}}, "U": {"narrOff": "Tắt lời dẫn", "narrOn": "Bật lời dẫn", "narrOnT": "Đã bật lời dẫn", "narrOffT": "Đã tắt lời dẫn", "sndOff": "Tắt âm thanh", "sndOn": "Bật âm thanh", "from": "{n} gửi tặng bạn", "flip": "Lật thẻ Kinh Thánh {n}", "mode": "Chế độ xem", "reset": "Xem lại chương này", "close": "Đóng", "knob": "Tay nắm cửa", "lang": "Ngôn ngữ", "sin": "TỘI", "creditShort": "Kinh Thánh: Thiên Ban Kinh Thánh Hiện Đại © Biblica, Inc. · CC BY-SA 4.0 · xem đầy đủ trong mục Chọn chương", "credit": "Kinh Thánh trích từ Thiên Ban Kinh Thánh Hiện Đại (Open Vietnamese Contemporary Bible). Copyright © 1982, 1987, 1994, 2005, 2015 by Biblica, Inc. Giấy phép CC BY-SA 4.0. Một số câu được trích một phần. The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible."}}
  ,ja:{"TITLE": "神へとつづく橋", "STEPS": ["", "1. 神の贈り物、永遠のいのち", "2. あなたの状態", "3. 人の力では救われない", "4. 神があなたのためにしてくださったこと", "5. どうすれば永遠のいのちを得られるか", "6. 信仰とは", "7. あなたは選ばなければなりません"], "T": {"c1": {"title": "あなたにとって一番大切なものは何ですか？", "sub": "カードをタップして、幸せを満たしてみましょう。", "empty": "すべてを手に入れても、心はまだ空っぽ。なぜでしょう？", "fellow": "神はもともと、私たちと親しく交わるために人を造られました。", "crack": "ところが、私たちが罪を犯したことで罪が入り込み、神との関係が断たれてしまいました。", "gap": "今、人と神との間には深い隔たりがあります。"}, "c2": {"title": "神は私たちの状態をこのように示しています。", "sub": "3つを順番にタップしてみましょう。", "end": "これが、神から離れた人の状態です。"}, "c3": {"title": "自分の力で神のもとへ行けるでしょうか？", "sub": "カードを崖のすき間までドラッグしてみましょう。タップでもOKです。", "building": "橋をかけています…", "tryOther": "ほかのカードも試してみましょう。", "endTitle": "人の力では、この隔たりを越えられません。", "endSub": "では、方法はないのでしょうか？"}, "c4": {"title": "ここに、あなたのための神の解決があります。", "bridge": "イエス・キリストが、神へとつづく橋になってくださいました。", "sub": "イエスがしてくださったことを、一つずつタップしてみましょう。", "end": "これで、神へ行く道が開かれました。"}, "c5": {"title": "橋はかけられ、神の約束が与えられました。", "sub": "「聞いて」と「信じる」を順番にタップして、橋を渡ってみましょう。", "promise": "神は信じる人に、このように約束されました。"}, "c6": {"title": "では、信じるとはどういうことでしょう？", "sub": "ノックの音が聞こえますか？ 取っ手を引いて、扉を開けてみましょう。", "open": "今、心の扉を開いて、イエス・キリストをお迎えすることができます。", "pray": "心をこめて、一緒に祈ってみませんか？"}, "c7": {"title": "あなたは今、どちら側にいますか？", "here": "どちらで永遠を過ごすかは、自分で決めなければなりません。", "think": "橋はもうかかっています。一歩踏み出すだけでいいのです。", "there": "イエスを心にお迎えしましたか？ それなら、イエスは今どこにおられるでしょう？"}, "c4x": {"hold": "画面を長押ししてみましょう。"}, "c5x": {"swipe": "上にスワイプして、橋を渡ってみましょう。"}, "c6x": {"quiet": "では少しのあいだ、言いたいことを神に直接お話ししてみましょう。", "quietWait": "ゆっくり祈ってもだいじょうぶです。", "quietEnd": "祈り終えたら、画面をタップしてください。", "sent": "祈りが神に届きました"}, "c7x": {"next": "次の一歩", "app1": "救いの確信のみことばを覚える", "app2": "今日のみことばを思いめぐらす", "web": "「みことばの手」で始める"}, "c6y": {"easy": "難しくありません。ただ信じればいいのです。", "pray": "祈る"}, "c7y": {"cong": "おめでとうございます！ あなたは今、神の子どもになりました。", "joy": "あなたが帰ってきたことを、神はだれよりも喜んでおられます。"}, "view": {"together": "操作モード · タップで進めて、自分でやってみよう", "alone": "再生モード · 動画のように自動で進みます", "chapters": "章をえらぶ"}, "verseFront": "みことばで確かめる", "verseHint": "カードをタップしてめくってみましょう", "swipe": "横にスワイプしてみましょう", "more": "もっとみことばを見る", "close": "閉じる"}, "SFX": {"collapse": "ガラガラ！", "impact": "ドーン！", "glow": "パァッ！", "sparkle": "キラキラ"}, "BTN": {"next": "次へ進む", "again": "もう一度", "restart": "最初から", "prayer": "祈りの言葉をもう一度見る"}, "C1": [{"nm": "お金"}, {"nm": "名誉"}, {"nm": "学問"}, {"nm": "快楽"}], "C2": [{"label": "1. 罪人", "head": "1. あなたは罪人です", "text": "すべての人は罪を犯して、神の栄光を受けることができず。", "ref": "ローマ人への手紙 3:23"}, {"label": "2. さばき", "head": "2. あなたはさばきを受けます", "text": "そして、人間には、一度死ぬことと死後にさばきを受けることが定まっているように。", "ref": "ヘブル人への手紙 9:27"}, {"label": "3. 死", "head": "3. 刑罰は死、すなわち地獄です", "text": "しかし、臆病な者、不信仰な者、忌まわしい者、人を殺す者、淫らなことを行う者、魔術を行う者、偶像を拝む者、すべて偽りを言う者たちが受ける分は、火と硫黄の燃える池の中にある。これが第二の死である。", "ref": "ヨハネの黙示録 21:8"}], "C3": {"good": {"name": "善い行い", "q": "善いことをたくさんすれば、神のもとへ行けるでしょうか？", "fail": "善い行いは尊いものですが、罪の隔たりを埋めることはできません。"}, "religion": {"name": "宗教生活", "q": "熱心に宗教生活をすれば、神のもとへ行けるでしょうか？", "fail": "宗教生活も、罪の隔たりを埋めることはできません。"}, "moral": {"name": "道徳的な努力", "q": "正しく生きようと努力すれば、神のもとへ行けるでしょうか？", "fail": "いちばん近くまで行けましたが、それでも届きません。"}, "edu": {"name": "教育・哲学", "q": "たくさん学び、深く考えれば、神のもとへ行けるでしょうか？", "fail": "人の知恵では、神を知ることはできません。"}}, "C4": [{"label": "あなたの罪のために死なれた"}, {"label": "葬られた"}, {"label": "三日目によみがえられた"}], "C5": [{"label": "聞いて"}, {"label": "信じる"}], "PROMISES": ["永遠のいのちを持ち（現在）", "さばきにあうことがなく（未来）", "死からいのちに移っています（過去）"], "C7": [{"label": "まだこちら側です"}, {"label": "考え中です"}, {"label": "渡りました"}], "PRAYER": "神さま、私は自分が罪人であることを認めます。イエスさまが私を愛して、私の罪を代わりに負い、十字架にかかって死に、よみがえられたことを信じて感謝します。今、イエスさまを私の救い主として信じ、心にお迎えします。どうか私の心に入って、私の人生を導いてください。イエスさまのお名前によって祈ります。アーメン。", "V": {"mk836": {"ref": "マルコの福音書 8:36", "text": "人は、たとえ全世界を手に入れても、自分のいのちを失ったら、何の益があるでしょうか。"}, "is646": {"ref": "イザヤ書 64:6", "text": "私たちはみな、汚れた者のようになり、その義はみな、不潔な衣のようです。"}, "ep289": {"ref": "エペソ人への手紙 2:8-9", "text": "この恵みのゆえに、あなたがたは信仰によって救われたのです。それはあなたがたから出たことではなく、神の賜物です。行いによるのではありません。だれも誇ることのないためです。"}, "je179": {"ref": "エレミヤ書 17:9", "text": "人の心は何よりもねじ曲がっている。それは癒やしがたい。"}, "co121": {"ref": "コリント人への手紙 第一 1:21", "text": "神の知恵により、この世は自分の知恵によって神を知ることがありませんでした。"}, "pr1412": {"ref": /* ===== v14: 배경 음악 (Lyria로 만든 3곡, bgm/b1~b3.mp3) =====
   1~3장 어스름 · 4~5장 새벽 · 6~7장 빛. 장이 바뀌면 천천히 겹쳐 바뀌고, 나레이션이 나올 땐 작아짐. 🔊 로 함께 꺼짐.
   못 받으면(오프라인) 조용히 건너뜀 */
const BGM_VOL=.55,BGM_DUCK=.22,bgmFor=ch=>ch<=3?0:ch<=5?1:2;
const BGM=[];let bgmCur=-1;
let bgmReady=false;
function bgmKick(){if(!ac)return;
  /* 처음 누를 때 세 곡을 모두 깨워 둠(휴대폰은 누른 순간에만 소리 재생을 허락) */
  if(!bgmReady){bgmReady=true;const cur=bgmFor(Math.max(1,CH));[0,1,2].forEach(k=>{bgmTo(k);if(k!==cur){const a=BGM[k].a;const p=a.play();if(p&&p.then)p.then(()=>{if(bgmCur!==k)a.pause();}).catch(()=>{});}});}
  bgmTo(bgmFor(Math.max(1,CH)));}
function bgmTo(k){
  if(!ac)return;
  if(!BGM[k]){const a=new Audio('bgm/b'+(k+1)+'.mp3');a.loop=true;a.preload='auto';let g=null;
    try{const src=ac.createMediaElementSource(a);g=ac.createGain();g.gain.value=0;src.connect(g).connect(ac.destination);}catch(_){a.volume=0;}
    BGM[k]={a,g};}
  if(bgmCur===k&&!BGM[k].a.paused)return;bgmCur=k;
  const b=BGM[k];if(soundOn){const p=b.a.play();if(p&&p.catch)p.catch(()=>{});}
}
function bgmLevel(){const t=ac?ac.currentTime:0;
  BGM.forEach((b,i)=>{if(!b)return;const want=!soundOn||document.hidden||i!==bgmCur?0:(narrA?BGM_DUCK:BGM_VOL);
    if(b.g){b.g.gain.setTargetAtTime(want,t,i===bgmCur?.6:.8);}else b.a.volume=want;
    if(want===0&&!b.a.paused&&!b.st){b.st=setTimeout(()=>{b.st=0;if(i!==bgmCur||!soundOn||document.hidden)b.a.pause();},3500);}
    if(want>0&&b.a.paused&&soundOn){const p=b.a.play();if(p&&p.catch)p.catch(()=>{});}});}
setInterval(bgmLevel,200);
if(/[?&]test=1/.test(location.search))window.__bgm=()=>({cur:bgmCur,b:BGM.map(b=>b&&{p:b.a.paused,t:+b.a.currentTime.toFixed(1),g:b.g?+b.g.gain.value.toFixed(2):b.a.volume})});

const P=[];
function motes(){P.push({t:'mote',x:DOOR.x+rand(-70,70),y:DOOR.y+rand(0,60),vx:rand(-.15,.15),vy:rand(-.7,-.25),r:rand(1.6,4.2),life:0,max:rand(160,320),c:'255,250,230'});}

  for(let i=0;i<10;i++)P.push({t:'dust',x:x+rand(-60,60),y:y+rand(-40,40),vx:rand(-.6,.6),vy:rand(-.6,.2),r:rand(18,34),life:0,max:rand(60,100)});
}
function puff(){for(let i=0;i<3;i++)P.push({t:'dust',x:EDGE.x+rand(-30,30),y:EDGE.y+rand(-10,10),vx:rand(-.8,.3),vy:rand(-.9,-.2),r:rand(8,14),life:0,max:50});}
/* v15: 축하 꽃가루 — 화면 위 여러 곳에서 금빛 · 분홍 알갱이가 터짐 */
function celebrate(){const cols=['#fff1b8','#ffd6e0','#ffe3a3','#ffffff','#b8f0d0'];
  [[200,420],[560,360],[384,620],[150,820],[620,780]].forEach(([x,y],i)=>setTimeout(()=>{if(CH===7){burst(x,y,cols);snd.ping(i%3);}},i*380));
  setTimeout(()=>{if(CH===7)sfx('🎉',50,30,'#ffe3a3');},300);}
function burst(cx=CROSS.x,cy=CROSS.y,cols=['#ffd6e0','#fff1b8']){for(let i=0;i<(reduce?15:60);i++){const a=rand(0,Math.PI*2),v=rand(2,9);P.push({t:'star',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:rand(4,10),life:0,max:rand(50,90),c:cols[i%cols.length],drag:.94});}}
function spark(x,y,c){P.push({t:'star',x,y,vx:rand(-.3,.3),vy:rand(-1.4,-.5),r:rand(3,8),life:0,max:rand(70,130),c,drag:1});}
function star(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill();}
function loop(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  const cu=CUT[mode]||{},m=cu.fx||(cu.door?'motes':null);
  if(m==='motes'&&Math.random()<.3)motes();
  if(cu.stars&&Math.random()<.12)P.push({t:'tw',x:rand(20,748),y:rand(20,620),r:rand(3,7),life:0,max:rand(90,200),c:Math.random()<.7?'#fffbe8':'#ffe3a3'});
  if(m==='spark'&&Math.random()<.6){const t=Math.random(),[a,b]=cu.path;spark(a[0]+(b[0]-a[0])*t+rand(-40,40),a[1]+(b[1]-a[1])*t+rand(-30,30),Math.random()<.5?'#ffc9d6':'#fff1b8');}
  if(m==='door'&&Math.random()<.5)spark(DOOR.x+rand(-90,90),DOOR.y+rand(-60,80),Math.random()<.5?'#fff1b8':'#ffd6e0');
  if(m==='gold'&&Math.random()<.5)spark(rand(80,700),rand(300,1100),Math.random()<.6?'#fff1b8':'#ffe0a0');
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life++;const k=p.life/p.max;
    if(k>=1||p.y>IH+60){P.splice(i,1);continue;}
    if(p.t==='mote'){p.x+=p.vx+Math.sin((p.life+i)*.05)*.2;p.y+=p.vy;const a=Math.sin(k*Math.PI);
      ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(${p.c},${.22*a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
      ctx.fillStyle=`rgba(${p.c},${.85*a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    else if(p.t==='rock'){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.globalCompositeOperation='source-over';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.strokeStyle='rgba(60,40,40,.5)';ctx.lineWidth=1.5;ctx.strokeRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();}
    else if(p.t==='dust'){p.x+=p.vx;p.y+=p.vy;p.r*=1.02;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(220,210,220,${.35*(1-k)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    else if(p.t==='tw'){const a=Math.sin(k*Math.PI);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*.9;ctx.fillStyle=p.c;star(p.x,p.y,p.r*(.6+.4*a));ctx.globalAlpha=1;}
    else if(p.t==='star'){p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;const a=Math.sin(k*Math.PI)*(.6+.4*Math.sin(p.life*.4));
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=p.c;star(p.x,p.y,p.r);ctx.globalAlpha=1;}
  }
  ctx.globalCompositeOperation='source-over';requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== v14: 나레이션 (타입캐스트 · 한영) =====
   voice/index.json = { lines: { "화면 글": { f:"소리 파일", d:길이(1/100초), t:[글자마다 밝아지는 때(1/100초)] } } }
   파일이 없거나 못 받으면 조용히 건너뜀(글만 보임). 함께 보기에서는 끔이 기본(보여 주는 사람이 설명) */
const VOICE_VER='33';
let NARR=null,narrOn=true,narrUser=false,narrA=null,narrRaf=0,narrTok=0,narrP=Promise.resolve(false);
fetch('voice/'+(LANG==='ko'?'index':LANG)+'.json?v='+VOICE_VER).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.lines){NARR=j.lines;$('narrBtn').hidden=false;paintNarr();}}).catch(()=>{});
const narrBlob={};
function narrUrl(f){return narrBlob[f]||(narrBlob[f]=fetch('voice/'+f).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>URL.createObjectURL(b)).catch(()=>{delete narrBlob[f];return null;}));}
function narrHas(text){return !!(NARR&&text&&NARR[text]&&soundOn&&narrOn);}
function narrStop(){narrTok++;if(narrA){try{narrA.pause();}catch(_){}narrA=null;}cancelAnimationFrame(narrRaf);
  document.querySelectorAll('.nr').forEach(e=>{e.classList.remove('nr');e.querySelectorAll('span').forEach(x=>x.classList.add('on'));});narrP=Promise.resolve(false);}
/* 한 줄 읽기: el 의 글자를 span 으로 나눠, 읽는 자리까지 밝힘. 다 읽으면 풀림 */
function say1(el,text,tok){
  const L=NARR[text];
  return Promise.race([narrUrl(L.f),wait(8000).then(()=>null)]).then(url=>new Promise(res=>{  /* 소리를 8초 안에 못 받으면 글만 */
    if(!url||tok!==narrTok)return res(false);
    el.textContent='';const sp=text.split('').map(ch=>{const s=document.createElement('span');s.textContent=ch;el.appendChild(s);return s;});el.classList.add('nr');
    const a=new Audio(url);narrA=a;a.volume=.95;let i=0,fin=false;
    const end=ok=>{if(fin)return;fin=true;cancelAnimationFrame(narrRaf);sp.forEach(s=>s.classList.add('on'));el.classList.remove('nr');if(narrA===a)narrA=null;res(ok);};
    const tick=()=>{if(tok!==narrTok)return end(false);const t=a.currentTime*100;while(i<sp.length&&L.t[i]<=t)sp[i++].classList.add('on');narrRaf=requestAnimationFrame(tick);};
    a.addEventListener('ended',()=>end(true));a.addEventListener('pause',()=>{if(!a.ended)end(false);});a.addEventListener('error',()=>end(false));
    setTimeout(()=>{end(true);try{a.pause();}catch(_){}},L.d*10+4000);
    a.play().then(()=>{narrRaf=requestAnimationFrame(tick);}).catch(()=>end(false));
  }));
}
/* 여러 줄을 차례로. 지금 읽는 것이 끝나면 풀리는 narrP 를 남김(true = 실제로 읽었음) */
function sayAll(list){
  const tok=narrTok,items=list.filter(x=>x&&x[0]&&narrHas(x[1]));
  if(!items.length)return narrP=Promise.resolve(false);
  return narrP=(async()=>{let any=false;for(const [el,t] of items){if(tok!==narrTok)break;any=(await say1(el,t,tok))||any;}return any;})();
}

const zone=$('drop');

document.querySelectorAll('.card.drag').forEach(card=>{
  card.addEventListener('pointerdown',e=>{
    if(!choiceWait||choiceWait.id!=='p3'||card.classList.contains('used'))return;
    ensureAudio();e.preventDefault();
    const r=card.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;ghost=card.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';document.body.appendChild(ghost);zone.classList.add('show');snd.pick();}
      if(ghost){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';zone.classList.toggle('hot',overZone(ev.clientX,ev.clientY));}
    };
    const up=ev=>{
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      zone.classList.remove('show','hot');
      if(!moved){pick('p3',card.dataset.key);return;}
      if(overZone(ev.clientX,ev.clientY)){ghost.remove();pick('p3',card.dataset.key);}
      else{ghost.classList.add('back');ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';setTimeout(()=>ghost.remove(),320);}
    };
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick('p3',card.dataset.key);}});

  const mb=$('vsMore');mb.hidden=!(o.more&&o.more.length);mb.textContent='📚 '+T.more;

  $('vs').classList.add('show');app.classList.add('vson');snd.flip(true);vib(10);
  /* 긴 말씀이 위 자막에 닿으면 자막을 잠시 숨김 */
  {const top=($('vsLead').textContent?$('vsLead'):vt).getBoundingClientRect().top;app.classList.toggle('vsfull',top<$('caption').getBoundingClientRect().bottom+8);}
  narrStop();
  if(narrHas(v.text)){sayAll([o.lead?[$('vsLead'),o.lead]:null,[vt,v.text]]);return;}
  /* 소리 파일이 없으면 머리말만 읽고, 말씀 글자는 읽는 빠르기로 밝힘 */

/* ===== v14: 4장 길게 누르기 — 누르는 동안 빛이 차오르고, 떼면 줄어듦 ===== */
let holdWait=null;
function waitHold(ms=1500){
  const box=$('hold'),fg=$('holdFg');box.classList.add('show');let p=0,on=false,last=0,raf=0,buzz=0;
  const paint=()=>{fg.style.strokeDashoffset=264*(1-p);$('crossGlow').style.opacity=p*.9;$('crossGlow').style.transform=`translate(-50%,-50%) scale(${.6+p*.4})`;};
  return new Promise(res=>{
    const step=now=>{const dt=last?now-last:16;last=now;p=Math.max(0,Math.min(1,p+(on?dt/ms:-dt/500)));paint();
      if(on&&now-buzz>220){buzz=now;vib(8+Math.round(p*30));tone(180+p*420,.18,'sine',.04+p*.05);}
      if(p>=1){done();return;}raf=requestAnimationFrame(step);};
    const down=e=>{if(e.target.closest('button,.sheet,.chlist'))return;e.preventDefault();ensureAudio();on=true;box.classList.add('on');};
    const up=()=>{on=false;box.classList.remove('on');};
    const key=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();p=1;}};
    const done=()=>{autoClear();cancelAnimationFrame(raf);app.removeEventListener('pointerdown',down);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);document.removeEventListener('keydown',key);
      box.classList.remove('show','on');fg.style.strokeDashoffset=264;$('crossGlow').style.opacity='';$('crossGlow').style.transform='';holdWait=null;res();};
    holdWait=done;autoWait(()=>{on=true;box.classList.add('on');},1200);app.addEventListener('pointerdown',down);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);document.addEventListener('keydown',key);
    raf=requestAnimationFrame(step);});
}

/* ===== v14: 5장 위로 밀어 건너기 — 미는 만큼 다리 위로 걸어감(발소리). 한 번 누르면 저절로 ===== */
let swipeWait=null;
function waitSwipe(){
  const box=$('swipe');box.classList.add('show');
  return new Promise(res=>{
    let sx=0,sy=0,p=0,steps=0,drag=false,fin=false;
    const set=v=>{p=Math.max(p,Math.min(1,v));zoom(1.05+p*.11,120);$('swipeFill').style.height=(p*100)+'%';box.querySelector('.hand').style.bottom=(p*110)+'px';const n=Math.floor(p*6);while(steps<n){steps++;tone(steps%2?150:130,.09,'triangle',.07);noise(.05,.12,700,'lowpass');vib(6);}};
    const done=()=>{if(fin)return;fin=true;autoClear();cleanup();box.classList.remove('show','on');$('swipeFill').style.height='0';box.querySelector('.hand').style.bottom='';swipeWait=null;res();};
    const auto=()=>{box.classList.add('on');animate(1600,t=>{if(!fin)set(p+(1-p)*t);}).then(done);};
    const down=e=>{if(e.target.closest('button,.sheet,.chlist'))return;e.preventDefault();ensureAudio();sx=e.clientX;sy=e.clientY;drag=false;box.classList.add('on');set(p+.05);
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);};
    const move=e=>{const dy=sy-e.clientY,dx=e.clientX-sx,d=Math.max(dy,Math.hypot(dx,dy)*.8);if(d>8)drag=true;set(d/150);if(p>=1)done();};  /* v15: 비스듬히 · 옆으로 끌어도 앞으로 */
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      if(fin)return;auto();};  /* v15: 손을 떼면 남은 길은 저절로 */
    const key=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();auto();}};
    const cleanup=()=>{app.removeEventListener('pointerdown',down);document.removeEventListener('keydown',key);document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);};
    swipeWait=done;autoWait(()=>{if(!fin)auto();},1200);app.addEventListener('pointerdown',down);document.addEventListener('keydown',key);
  });
}

    const key=await c.until(waitChoice('p3'));markUsed('p3',key);const d=C3[key];
    cap(d.q,T.c3.building);gaugeInit('🧍','🚪',d.color);await c.w(250);gauge.classList.add('show');
    let tk=0;await c.until(animate(1800,t=>{const v=d.pct*easeOut(t);gaugeSet(v);const n=Math.floor(v/8);if(n>tk){tk=n;snd.tick(n);vib(6);puff();}}));
    await c.w(250);gauge.classList.add('wobble');snd.creak();vib([15,40,15,40,15]);await c.hold(800);
    gauge.classList.remove('wobble');gauge.classList.add('broke');
    show(d.img,140);snd.crash();vib([50,30,90]);shake(true);debris(250,880,d.cols);restart($('sin'),'pulse');
    setTimeout(()=>{if(CH===3)sfx(SFX.collapse,36,48,'#ffb36b');},120);
    [...$('p3dots').children].forEach((dt,k)=>dt.classList.toggle('on',k<=i));
    await c.w(350);panel(null);await cap(d.fail,'');await c.hold(1400);
    gauge.classList.remove('show','broke');
    await verse(c,V[d.vk]);
    if(i<3){show('t3_0',800);await cap(T.c3.title,T.c3.tryOther);panel('p3');}
  }
  show('t3_5',1200,'down');sin('big');await cap(T.c3.endTitle,T.c3.endSub);snd.chord();await c.hold(600);
  await verse(c,V.ep289);start(4);
}

/* ===== 4장 하나님께서 당신을 위해 해주신 일 ===== */
async function ch4(c){
  show('t4_1',2600,'up');sin('big');await cap(T.c4.title,'');snd.swell();
  await c.hold(2200);await cap(T.c4.title,T.c4x.hold);await c.until(waitHold());snd.rumble();shake(false);await c.w(700);
  snd.whoosh();restart($('beam'),'drop');await c.w(420);
  flash();show('t4_2',0);$('beam').classList.remove('drop');sin(null);snd.boom();vib([90,40,140]);shake(true);burst();cross('show');
  setTimeout(()=>{if(CH===4)sfx(SFX.impact,58,34,'#ff6b81');},80);
  await c.w(1500);restart($('crossGlow'),'surge');snd.swell();sfx(SFX.glow,64,60,'#ffc2d1');await c.w(1200);
  cross('soft');await cap(T.c4.bridge,'');await c.hold(600);
  await verse(c,V.ro58);
  await cap(T.c4.bridge,T.c4.sub);resetPanel('p4');panel('p4');
  for(let i=0;i<3;i++){
    enableOnly('p4',i);const key=await c.until(waitChoice('p4'));markUsed('p4',key);
    if(i===0){cross(null);show('t4_3',900,'in');snd.bell();vib([80]);await c.w(1800);}
    if(i===1){show('t4_4',1400,'down');snd.low();await c.w(1900);}
    if(i===2){flash(true);show('t4_5',0);burst(228,724,['#fff1b8','#ffe0a0','#ffffff']);snd.chime();vib([30,50,30]);await c.w(1800);}
  }
  panel(null);await cap(T.c4.end,'');await c.hold(900);
  await verse(c,V.co1534,{more:[V.jn146]});start(5);
}

/* ===== 5장 어떻게 당신이 영생을 얻을 수 있는가? ===== */
async function ch5(c){
  show('t5_1',1000,'in');await cap(T.c5.title,T.c5.sub);
  resetPanel('p5');panel('p5');
  enableOnly('p5',0);let key=await c.until(waitChoice('p5'));btnFx('p5',key,'👂');
  [523,659,784].forEach((f,i)=>tone(f,.8,'sine',.07,null,i*.14));vib([15,60,15]);await c.w(1100);markUsed('p5',key);
  await c.w(300);enableOnly('p5',1);key=await c.until(waitChoice('p5'));btnFx('p5',key,'💛');markUsed('p5',key);
  show('t5_2',700,'in');tone(392,1,'sine',.07);vib(20);await c.w(1300);
  panel(null);show('t5_3',900,'up');await cap(T.c5.title,T.c5x.swipe);await c.until(waitSwipe());
  sfx(SFX.sparkle,36,27,'#fff3b0');snd.chime();vib([20,40,20]);await c.w(900);
  flash(true);zoom(1,0);show('t5_4',0);
  await cap(T.c5.promise,'');
  for(let i=0;i<3;i++){await c.w(550);$('chips').appendChild(h('div','chip',PROMISES[i]));snd.ping(i);vib(10);}
  await c.hold(1500);
  await verse(c,V.jn524);$('chips').innerHTML='';start(6);
}

/* ===== 6장 믿음이란? — 문 두드리는 소리와 함께 요한계시록 3:20 ===== */
async function ch6(c,sub){
  if(sub!=='prayer'){
    show('t6_1',1000,'in');await cap(T.c6.title,'');
    knocking(true);await verse(c,V.re320);
    await cap(T.c6.title,T.c6.sub);await c.until(waitKnob());knocking(false);
    snd.open();flash(true);show('t6_2',900,'in');vib([20,40,60]);$('doorLight').style.opacity=0;
    await c.w(700);snd.chime();await cap(T.c6.open,'');await c.hold(600);
    await verse(c,V.jn112);
  }
  if(sub==='prayer'){
    /* v15: 7장에서 돌아왔을 때는 같은 물음을 되풀이하지 않고, 쉬운 말 한 줄 + 「기도하기」 단추 */
    show('t6_3',1100,'in');await cap(T.c6y.easy,'');await c.hold(1200);await c.until(openSheet([],[{k:'pray',label:'🙏 '+T.c6y.pray,cls:'main'}]));
  }else{show('t6_3',1100,'in');await cap(T.c6.pray,'');}
  await c.hold(500);$('prayer').textContent=PRAYER;$('prayer').classList.add('show');snd.swell();
  await c.w(800);say($('prayer'),PRAYER);await c.tap();narrStop();$('prayer').classList.remove('show');
  await quietPrayer(c);
  start(7);
}

/* ===== 7장 당신은 선택해야 합니다 ===== */
async function ch7(c){
  show('t7_1',1200,'in');await cap(T.c7.title,'');resetPanel('p7');panel('p7');
  const key=await c.until(waitChoice('p7'));panel(null);
  if(key==='here'){show('t7_2',1000,'down');dark(.35);snd.low();await cap(T.c7.here,'');await c.hold(800);await verse(c,V.jn336,{more:[V.ro245]});}
  if(key==='think'){show('t7_3',1000,'up');snd.swell();await cap(T.c7.think,'');await c.hold(800);await verse(c,V.jn336);}
  if(key==='there'){show('t7_4',1000,'in');snd.chime();vib([20,40,20]);await cap(T.c7.there,'');await c.hold(800);await verse(c,V.jo51113);
    /* v15: 하나님의 자녀가 된 것을 축하 — 금빛 번쩍임 · 꽃가루 · 말씀(스바냐 3:17) */
    flash(true);snd.swell();vib([30,50,30,50,60]);celebrate();
    await cap(T.c7y.cong,T.c7y.joy);await c.hold(1600);
    await verse(c,V.zp317);}
  const sh=openSheet([],key==='there'?[{k:'restart',label:BTN.restart,cls:'soft'}]:[{k:'restart',label:BTN.restart,cls:'soft'},{k:'prayer',label:BTN.prayer,cls:'main'}]);
  const r=await c.until(sh);
  if(r==='restart')start(0);else start(6,'prayer');
}

const CHAPTERS=[ch0,ch1,ch2,ch3,ch4,ch5,ch6,ch7];

$('resetBtn').addEventListener('click',e=>{e.stopPropagation();ensureAudio();start(CH);});
$('muteBtn').addEventListener('click',e=>{e.stopPropagation();ensureAudio();soundOn=!soundOn;if(!soundOn)narrStop();$('muteBtn').textContent=soundOn?'🔊':'🔇';$('muteBtn').setAttribute('aria-label',soundOn?U.sndOff:U.sndOn);});

/* ===== 암송 Festival 에서 덧붙인 것 =====
   ?from=이름 : 링크를 보낸 사람 — 표지에 「○○ 님이 보내 드려요」
   ?in=app    : 암송 Festival 앱 안에서 열었을 때 — 오른쪽 위 ✕ 로 닫고 앱으로 돌아갑니다 */
const QS=new URLSearchParams(location.search);
const FROM=(QS.get('from')||'').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,20);
if(FROM){$('coverFrom').textContent=fmt(U.from,FROM);$('coverFrom').hidden=false;}
/* v15 4단계: 작은 글 · 언어 고르기(표지 아래 · 장 고르기 창 아래). 고르면 같은 주소에 lang 만 바꿔 다시 엶 */
$('sin').textContent=U.sin;
[['modeBtn',U.mode],['muteBtn',U.sndOff],['resetBtn',U.reset],['closeBtn',U.close],['chClose',U.close],['knob',U.knob]].forEach(([id,t])=>{$(id).setAttribute('aria-label',t);});
$('langs').setAttribute('aria-label',U.lang);$('langRow').setAttribute('aria-label',U.lang);
function langUrl(k){const q=new URLSearchParams(location.search);if(k==='ko')q.delete('lang');else q.set('lang',k);const s=q.toString();return location.pathname+(s?'?'+s:'');}
function paintLangs(box){for(const k of Object.keys(LANG_NAMES)){const b=h('button',k===LANG?'on':'',LANG_NAMES[k]);b.type='button';b.lang=k;if(k===LANG)b.setAttribute('aria-current','true');
  b.addEventListener('click',e=>{e.stopPropagation();if(k!==LANG)location.replace(langUrl(k));});box.appendChild(b);}}
paintLangs($('langBtns'));paintLangs($('langRow'));
for(const id of ['coverCredit','chCredit']){$(id).textContent=(id==='coverCredit'&&U.creditShort)||U.credit;$(id).hidden=!U.credit;}  /* 표지는 짧게(있으면), 장 고르기 창에는 다 */
const IN_APP=QS.get('in')==='app';VIEW=IN_APP?'together':'alone';narrOn=true;paintView();  /* v15: 나레이션은 두 모드 모두 켜고 시작(🗣️ 로 끔) */
if(IN_APP){
  const cb=$('closeBtn');cb.hidden=false;
  cb.addEventListener('click',e=>{
    e.stopPropagation();RUN++;resetUI();knocking(false);
    try{if(ac)ac.suspend();}catch(_){}
    if(window.parent!==window){try{parent.postMessage({navfest:'tract-close'},location.origin);}catch(_){}}
    else if(history.length>1)history.back();else location.href='../';
  });
}

start(0);
})();
</script>
