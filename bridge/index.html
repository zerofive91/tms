<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하나님께 가는 다리</title>
<meta name="description" content="눌러 보고 끌어 보며 따라가는 일곱 장의 이야기 — 하나님께 가는 다리">
<meta property="og:type" content="website">
<meta property="og:title" content="하나님께 가는 다리">
<meta property="og:description" content="눌러 보고 끌어 보며 따라가는 일곱 장의 이야기">
<meta name="theme-color" content="#23263f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#eef2fb; --ink:#1d2a44; --card:#ffffff; --line:#d9e0ef; --sun:#ff8a3d; --sin:#ff5a6e; --pink:#e8607a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:#23263f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141b2e;--ink:#eef2fb;--card:#1e2740;--line:#2e3a5a}}
:root[data-theme="dark"]{--bg:#141b2e;--ink:#eef2fb;--card:#1e2740;--line:#2e3a5a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{word-break:keep-all;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#23263f;color:#fff;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;overflow:clip;background:#2b2f4d}
.jua{font-family:'Jua','Pretendard',sans-serif;font-weight:400}

/* ===== 장면 ===== */
#cam{position:absolute;inset:0}
#cam.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
#cam.shakeBig{animation:shakeBig .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-2px)}}
@keyframes shakeBig{10%{transform:translate(-10px,6px)}20%{transform:translate(12px,-8px)}30%{transform:translate(-12px,4px)}40%{transform:translate(9px,-6px)}55%{transform:translate(-6px,4px)}70%{transform:translate(4px,-2px)}85%{transform:translate(-2px,1px)}}
#scene{position:absolute;transform-origin:30% 36%}
#kb{position:absolute;inset:0;transform-origin:30% 36%;animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.04)}}
.layer{position:absolute;inset:0;width:100%;height:100%;opacity:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ov{position:absolute;pointer-events:none;z-index:100000}
#glow{left:30.2%;top:35.4%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,244,210,.5),rgba(255,205,150,.16) 35%,transparent 66%);mix-blend-mode:screen;animation:pulse 3.4s ease-in-out infinite;transition:opacity .8s}
#glow.off{opacity:0}
@keyframes pulse{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)}}
#dark{inset:0;background:linear-gradient(to bottom,rgba(8,10,28,0) 28%,rgba(8,10,28,.55) 55%,rgba(8,10,28,.95));opacity:0;transition:opacity 1.2s}
#crossGlow{left:40%;top:60%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);background:radial-gradient(circle,rgba(255,170,190,.65),rgba(255,120,150,.2) 40%,transparent 68%);mix-blend-mode:screen;opacity:0;transition:opacity .8s, transform 1.2s cubic-bezier(.2,.9,.3,1)}
#crossGlow.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#crossGlow.soft{opacity:.45;transform:translate(-50%,-50%) scale(1)}
#crossGlow.surge{animation:surge 1.1s ease-out}
#crossGlow.red{background:radial-gradient(circle,rgba(255,70,90,.75),rgba(200,30,60,.25) 40%,transparent 68%)}
#crossGlow.gold{background:radial-gradient(circle,rgba(255,236,170,.8),rgba(255,200,120,.25) 40%,transparent 68%)}
@keyframes surge{30%{opacity:1;filter:brightness(1.8)}}
#sin{left:31%;top:73%;transform:translate(-50%,-50%);font-family:'Jua',sans-serif;font-size:calc(var(--u)*13);color:var(--sin);opacity:0;text-shadow:0 0 calc(var(--u)*3) rgba(255,60,90,.8);transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .8s}
#sin.on{opacity:.62}
#sin.big{transform:translate(-50%,-50%) scale(1.5);opacity:.9}
#sin.pulse{animation:sinp .55s}
@keyframes sinp{40%{transform:translate(-50%,-50%) scale(1.35);opacity:1}}
#drop{left:11%;top:43%;width:50%;height:27%;border:3px dashed rgba(255,255,255,.95);border-radius:24px;background:rgba(255,255,255,.14);opacity:0;transition:opacity .2s, background .2s}
#drop.show{opacity:.7}
#drop.hot{opacity:1;background:rgba(255,255,255,.3)}
#fx{left:0;top:0;width:100%;height:100%}
#beam{left:38%;top:0;width:16%;height:64%;transform:translate(-50%,-110%);background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,200,215,.85) 70%,#fff);filter:blur(5px);border-radius:0 0 50% 50%;opacity:0}
#beam.drop{animation:beam .42s cubic-bezier(.7,0,.9,.5) forwards}
@keyframes beam{0%{opacity:1;transform:translate(-50%,-110%)}100%{opacity:1;transform:translate(-50%,0)}}
#doorLight{left:24.3%;top:12.5%;width:5%;height:88%;background:linear-gradient(to right,rgba(255,236,200,0),rgba(255,240,210,.95),rgba(255,236,200,0));filter:blur(6px);mix-blend-mode:screen;opacity:0}
#knob{left:39.7%;top:68%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,255,255,.95);background:rgba(255,240,200,.18);box-shadow:0 0 24px rgba(255,230,180,.7);pointer-events:auto;touch-action:none;cursor:grab;display:none;animation:knob 1.4s ease-in-out infinite}
#knob.show{display:block}
@keyframes knob{50%{box-shadow:0 0 40px rgba(255,230,180,1);background:rgba(255,240,200,.32)}}
.fullov{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{background:#fff;z-index:12}
#flash.go{animation:flash .9s ease-out}
#flash.gold{background:#ffe7a8}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#tomb{background:#07080f;z-index:11;transition:opacity 1.3s ease}
.sfx{position:absolute;z-index:100001;pointer-events:none;font-family:'Jua',sans-serif;font-size:calc(var(--u)*9);line-height:1;white-space:nowrap;--o:#3a2140;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px -2px var(--o),2px -2px var(--o),-2px 2px var(--o),0 7px 0 rgba(0,0,0,.28);
  animation:sfx 1.6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes sfx{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(0);opacity:1}18%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.18)}32%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) rotate(-8deg) scale(1)}}

/* ===== 위쪽 ===== */
.topui{position:absolute;left:0;right:0;top:0;z-index:20;padding:12px 16px 56px;background:linear-gradient(to bottom,rgba(22,24,48,.8),rgba(22,24,48,.42) 62%,transparent);pointer-events:none;transition:opacity .4s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{font-size:13px;font-weight:700;opacity:.88;border:0;background:none;color:inherit;padding:6px 0;text-align:left;cursor:pointer;pointer-events:auto;min-width:0}
.step:not(:empty)::after{content:' ▾';opacity:.7}
.tools{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prog{display:flex;gap:4px;margin-top:10px;pointer-events:auto}
.prog button{flex:1;height:14px;border:0;background:none;cursor:pointer;position:relative}
.prog button::before{content:'';position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);transition:background .3s}
.prog button.done::before{background:rgba(255,255,255,.7)}
.prog button.cur::before{background:#ffb3c0}
.caption{margin-top:6px;transition:opacity .25s, transform .25s}
.caption.fade{opacity:0;transform:translateY(6px)}
.caption h1{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:23px;line-height:1.3;min-height:2.6em;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.caption p{font-size:14.5px;line-height:1.45;opacity:.9;min-height:1.45em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.app.cover .topui .step,.app.cover .prog,.app.cover .caption,.app.cover #resetBtn{visibility:hidden}

/* ===== v14: 보기 방식 · 장 고르기 · 길게 누르기 · 밀어 건너기 · 조용한 기도 · 다음 걸음 ===== */
.toast{position:absolute;left:50%;top:76px;z-index:60;transform:translate(-50%,-6px);max-width:calc(100% - 32px);background:rgba(20,22,44,.88);color:#fff;border-radius:14px;padding:9px 14px;font-size:13.5px;font-weight:700;line-height:1.45;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s, transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chlist{position:absolute;inset:0;z-index:70;background:rgba(14,16,34,.72);display:none;align-items:flex-start;justify-content:center;padding:64px 16px 16px}
.chlist.show{display:flex}
.chbox{width:100%;max-width:420px;background:var(--bg);color:var(--ink);border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:rise .35s both}
.chbox .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;font-weight:800;font-size:15px}
.chbox .hd button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chbox ol{list-style:none;display:grid;gap:7px}
.chbox ol button{width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 12px;font-size:14.5px;font-weight:700;line-height:1.4;cursor:pointer}
.chbox ol button[aria-current="step"]{border-color:var(--pink)}
.chbox ol button.done{opacity:.72}
.hold{position:absolute;left:50%;bottom:12%;z-index:25;width:92px;height:92px;transform:translateX(-50%);display:none;pointer-events:none}
.hold.show{display:block}
.hold svg{width:100%;height:100%;transform:rotate(-90deg)}
.hold circle{fill:none;stroke-width:7}
.hold .bg{stroke:rgba(255,255,255,.28)}
.hold .fg{stroke:#ffd6e0;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;filter:drop-shadow(0 0 8px rgba(255,180,200,.9))}
.hold .hand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:tap 1.1s ease-in-out infinite}
.hold.on .hand{animation:none;transform:scale(.9)}
.swipe{position:absolute;left:50%;bottom:10%;z-index:25;width:60px;height:150px;transform:translateX(-50%);display:none;pointer-events:none}
.swipe.show{display:block}
.swipe .rail{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(to top,rgba(255,255,255,.1),rgba(255,241,184,.7))}
.swipe .hand{position:absolute;left:50%;bottom:0;font-size:40px;transform:translateX(-50%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:swipeUp 1.6s ease-in-out infinite}
@keyframes swipeUp{0%{bottom:0;opacity:0}15%{opacity:1}80%{bottom:96px;opacity:1}100%{bottom:110px;opacity:0}}
.swipe.on .hand{animation:none;opacity:1}
.quiet{position:absolute;left:16px;right:16px;top:24%;z-index:16;background:rgba(20,22,44,.78);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:22px 20px 18px;text-align:center;display:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.quiet.show{display:block;animation:rise .8s both}
.quiet p{font-size:16px;line-height:1.7;font-weight:600}
.quiet small{display:block;margin-top:12px;font-size:13px;opacity:.8;min-height:1.4em}
.quiet .breath{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle,rgba(255,241,184,.9),rgba(255,214,224,.35) 55%,transparent 70%);animation:breath 6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.35);opacity:.65}}
.quiet .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}
.quiet .bar i{display:block;height:100%;width:0;background:#fff1b8}
.nextsteps{display:grid;gap:8px}
.nextsteps b{font-size:13px;opacity:.75;margin:2px 2px 0}
.nextsteps a,.nextsteps button{display:block;text-align:center;text-decoration:none;border:2px solid var(--pink);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 10px;font-weight:800;font-size:15px;cursor:pointer}
.nextsteps[hidden]{display:none}

/* ===== 게이지 ===== */
.gauge{position:absolute;left:22px;right:22px;top:31%;z-index:15;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .3s, transform .3s;pointer-events:none}
.gauge.show{opacity:1;transform:none}
.gauge .ic{font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.track{position:relative;flex:1;height:16px;border-radius:8px;border:2px solid #fff;background:rgba(20,22,45,.45);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.fill{height:100%;width:0;border-radius:6px;background:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.pct{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-family:'Jua',sans-serif;font-size:34px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.gauge.wobble .track{animation:wob .12s linear infinite}
@keyframes wob{50%{transform:translateX(2px) rotate(.6deg)}}
.gauge.broke .fill{background:var(--sin)!important}
.gauge.broke{animation:gdrop .8s ease-in forwards}
@keyframes gdrop{30%{transform:rotate(-4deg)}100%{transform:translateY(60px) rotate(8deg);opacity:0}}
.gauge.leak .track{animation:leak .5s ease-in-out infinite}
@keyframes leak{50%{box-shadow:0 0 0 4px rgba(255,90,110,.45)}}

/* ===== 가운데 패널들 ===== */
.chips{position:absolute;left:20px;right:20px;top:31%;z-index:16;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.chip{background:rgba(255,255,255,.93);color:#1d2a44;border-radius:999px;padding:11px 20px;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:chip .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes chip{from{transform:scale(.3);opacity:0}}
.prayer{position:absolute;left:16px;right:16px;top:25%;z-index:16;background:rgba(255,255,255,.93);color:#1d2a44;border-radius:22px;padding:20px 20px;font-size:15.5px;line-height:1.75;box-shadow:0 14px 34px rgba(0,0,0,.3);display:none}
.prayer.show{display:block;animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.cover-title{position:absolute;left:0;right:0;top:20%;z-index:18;text-align:center;display:none;pointer-events:none}
.app.cover .cover-title{display:block;animation:rise 1s both}
.cover-title b{font-family:'Jua',sans-serif;font-weight:400;font-size:44px;line-height:1.2;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.tap{position:absolute;left:50%;bottom:9%;z-index:25;font-size:46px;transform:translateX(-50%);display:none;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:tap 1.1s ease-in-out infinite}
.tap.show{display:block}
@keyframes tap{50%{transform:translate(-50%,-12px) scale(1.08)}}

/* ===== 아래 ===== */
.botui{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:56px 16px 14px;background:linear-gradient(to top,rgba(22,24,48,.84),rgba(22,24,48,.45) 62%,transparent);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.botui.hide{transform:translateY(115%)}
.panel{display:none;flex-direction:column;gap:10px}
.panel.on{display:flex}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:24px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:background .3s}
.dot.on{background:var(--sin)}
.grid{display:grid;gap:9px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.card,.opt{user-select:none;-webkit-user-select:none;background:rgba(255,255,255,.94);color:#1d2a44;border:0;border-radius:18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .12s, opacity .3s, filter .3s}
.card:active,.opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.card{padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .em{font-size:25px;line-height:1}
.card .nm{font-family:'Jua','Pretendard',sans-serif;font-size:16px;line-height:1.2;white-space:nowrap}
.card.row{flex-direction:row;justify-content:center;gap:8px;padding:12px 8px}
.card.drag{touch-action:none;cursor:grab}
.card .sw{width:6px;height:22px;border-radius:3px}
.opt{font-family:'Jua','Pretendard',sans-serif;font-size:17px;line-height:1.25;padding:14px 8px;min-height:54px}
.card.used,.opt.used{opacity:.42;filter:grayscale(1);pointer-events:none}
.opt:disabled{opacity:.42;pointer-events:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:scale(1.08) rotate(-4deg);box-shadow:0 18px 30px rgba(0,0,0,.35)}
.ghost.back{transition:left .3s, top .3s, opacity .3s;opacity:0}
.icon-btn:focus-visible,.card:focus-visible,.opt:focus-visible,.btn:focus-visible,.flip:focus-visible,.prog button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ===== 말씀 팝업 (2장) ===== */
.pop{position:absolute;inset:0;z-index:45;background:rgba(8,10,28,.5);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:18px}
.pop.show{display:flex}
.popcard{width:100%;background:var(--card);color:var(--ink);border-radius:24px;padding:22px 20px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:popin .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:rotateY(80deg) scale(.8);opacity:0}}
.popcard h2{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:21px;margin-bottom:10px}
.popcard div{font-size:15.5px;line-height:1.65}
.popcard .ref{margin-top:8px;font-weight:800;color:var(--pink);font-size:14px}
.pop .hand{font-size:40px;animation:tap 1.1s ease-in-out infinite;transform:none}

/* ===== 말씀 창 ===== */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--bg);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.3);padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px;transform:translateY(110%);transition:transform .55s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:translateY(0)}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.verses{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.verses::-webkit-scrollbar{display:none}
.flip{flex:0 0 100%;scroll-snap-align:center;perspective:1000px;height:206px;cursor:pointer;border:0;background:none;text-align:left}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.front{color:#fff;align-items:center;text-align:center;gap:6px}
.front b{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:23px}
.front span{font-size:14px;opacity:.92}
.front small{font-size:12px;opacity:.8;margin-top:4px}
.back{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:14.5px;line-height:1.6;overflow:auto;justify-content:flex-start}
.back .txt{margin:auto 0}
.back .ref{margin-top:6px;font-weight:800;color:var(--pink);font-size:14px}
.vdots{display:flex;gap:6px;justify-content:center}

let ac=null,soundOn=true;
function ensureAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function tone(freq,dur,type='sine',vol=.12,slideTo,delay=0){
  if(!ac||!soundOn)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05);}
function noise(dur=.3,vol=.35,freq=900,type='bandpass',delay=0){
  if(!ac||!soundOn)return;const len=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=.7;
  const g=ac.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(ac.destination);s.start(ac.currentTime+delay);}

const P=[];
function motes(){P.push({t:'mote',x:DOOR.x+rand(-70,70),y:DOOR.y+rand(0,60),vx:rand(-.15,.15),vy:rand(-.7,-.25),r:rand(1.6,4.2),life:0,max:rand(160,320),c:'255,250,230'});}
function debris(x,y,cols){
  for(let i=0;i<(reduce?8:30);i++)P.push({t:'rock',x:x+rand(-70,70),y:y+rand(-80,60),vx:rand(-2.4,2),vy:rand(-5,0),s:rand(7,20),a:rand(0,6),va:rand(-.2,.2),c:cols[i%cols.length],life:0,max:200});
  for(let i=0;i<10;i++)P.push({t:'dust',x:x+rand(-60,60),y:y+rand(-40,40),vx:rand(-.6,.6),vy:rand(-.6,.2),r:rand(18,34),life:0,max:rand(60,100)});
}
function puff(){for(let i=0;i<3;i++)P.push({t:'dust',x:EDGE.x+rand(-30,30),y:EDGE.y+rand(-10,10),vx:rand(-.8,.3),vy:rand(-.9,-.2),r:rand(8,14),life:0,max:50});}
function burst(cx=CROSS.x,cy=CROSS.y,cols=['#ffd6e0','#fff1b8']){for(let i=0;i<(reduce?15:60);i++){const a=rand(0,Math.PI*2),v=rand(2,9);P.push({t:'star',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:rand(4,10),life:0,max:rand(50,90),c:cols[i%cols.length],drag:.94});}}
function spark(x,y,c){P.push({t:'star',x,y,vx:rand(-.3,.3),vy:rand(-1.4,-.5),r:rand(3,8),life:0,max:rand(70,130),c,drag:1});}
function star(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill();}
function loop(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  const m=FXMODE[mode]===undefined?'motes':FXMODE[mode];
  if(m==='motes'&&Math.random()<.3)motes();
  if(m==='spark'&&Math.random()<.6){const t=Math.random();spark(470+(250-470)*t+rand(-40,40),1010+(560-1010)*t+rand(-30,30),Math.random()<.5?'#ffc9d6':'#fff1b8');}
  if(m==='door'&&Math.random()<.5)spark(DOOR.x+rand(-90,90),DOOR.y+rand(-60,80),Math.random()<.5?'#fff1b8':'#ffd6e0');
  if(m==='gold'&&Math.random()<.5)spark(rand(80,700),rand(300,1100),Math.random()<.6?'#fff1b8':'#ffe0a0');
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life++;const k=p.life/p.max;
    if(k>=1||p.y>IH+60){P.splice(i,1);continue;}
    if(p.t==='mote'){p.x+=p.vx+Math.sin((p.life+i)*.05)*.2;p.y+=p.vy;const a=Math.sin(k*Math.PI);
      ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(${p.c},${.22*a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,7);ctx.fill();
      ctx.fillStyle=`rgba(${p.c},${.85*a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    else if(p.t==='rock'){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.globalCompositeOperation='source-over';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.strokeStyle='rgba(60,40,40,.5)';ctx.lineWidth=1.5;ctx.strokeRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();}
    else if(p.t==='dust'){p.x+=p.vx;p.y+=p.vy;p.r*=1.02;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(220,210,220,${.35*(1-k)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    else if(p.t==='star'){p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;const a=Math.sin(k*Math.PI)*(.6+.4*Math.sin(p.life*.4));
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=p.c;star(p.x,p.y,p.r);ctx.globalAlpha=1;}
  }
  ctx.globalCompositeOperation='source-over';requestAnimationFrame(loop);
}

const VOICE_VER='1';
let NARR=null,narrOn=true,narrA=null,narrRaf=0,narrTok=0,narrP=Promise.resolve(false);
fetch('voice/index.json?v='+VOICE_VER).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.lines){NARR=j.lines;$('narrBtn').hidden=false;paintNarr();}}).catch(()=>{});
const narrBlob={};
function narrUrl(f){return narrBlob[f]||(narrBlob[f]=fetch('voice/'+f).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>URL.createObjectURL(b)).catch(()=>{delete narrBlob[f];return null;}));}
function narrHas(text){return !!(NARR&&text&&NARR[text]&&soundOn&&narrOn);}
function narrStop(){narrTok++;if(narrA){try{narrA.pause();}catch(_){}narrA=null;}cancelAnimationFrame(narrRaf);
  document.querySelectorAll('.nr').forEach(e=>{e.classList.remove('nr');e.querySelectorAll('span').forEach(x=>x.classList.add('on'));});narrP=Promise.resolve(false);}
/* 한 줄 읽기: el 의 글자를 span 으로 나눠, 읽는 자리까지 밝힘. 다 읽으면 풀림 */
function say1(el,text,tok){
  const L=NARR[text];
  return narrUrl(L.f).then(url=>new Promise(res=>{
    if(!url||tok!==narrTok)return res(false);
    el.textContent='';const sp=text.split('').map(ch=>{const s=document.createElement('span');s.textContent=ch;el.appendChild(s);return s;});el.classList.add('nr');
    const a=new Audio(url);narrA=a;a.volume=.95;let i=0,fin=false;
    const end=ok=>{if(fin)return;fin=true;cancelAnimationFrame(narrRaf);sp.forEach(s=>s.classList.add('on'));el.classList.remove('nr');if(narrA===a)narrA=null;res(ok);};
    const tick=()=>{if(tok!==narrTok)return end(false);const t=a.currentTime*100;while(i<sp.length&&L.t[i]<=t)sp[i++].classList.add('on');narrRaf=requestAnimationFrame(tick);};
    a.addEventListener('ended',()=>end(true));a.addEventListener('pause',()=>{if(!a.ended)end(false);});a.addEventListener('error',()=>end(false));
    setTimeout(()=>end(true),L.d*10+4000);
    a.play().then(()=>{narrRaf=requestAnimationFrame(tick);}).catch(()=>end(false));
  }));
}
/* 여러 줄을 차례로. 지금 읽는 것이 끝나면 풀리는 narrP 를 남김(true = 실제로 읽었음) */
function sayAll(list){
  const tok=narrTok,items=list.filter(x=>x&&x[0]&&narrHas(x[1]));
  if(!items.length)return narrP=Promise.resolve(false);
  return narrP=(async()=>{let any=false;for(const [el,t] of items){if(tok!==narrTok)break;any=(await say1(el,t,tok))||any;}return any;})();
}

knob.addEventListener('pointerdown',e=>{
  if(!knobWait)return;ensureAudio();e.preventDefault();e.stopPropagation();
  const sx=e.clientX,sy=e.clientY;let d=0,done=false;
  const fin=()=>{if(done)return;done=true;cleanup();knob.style.transform='';const r=knobWait;knobWait=null;knob.classList.remove('show');r();};
  const move=ev=>{d=Math.hypot(ev.clientX-sx,ev.clientY-sy);const p=Math.min(1,d/110);
    knob.style.transform=`translate(calc(-50% + ${ev.clientX-sx}px),calc(-50% + ${ev.clientY-sy}px))`;$('doorLight').style.opacity=.25+p*.75;if(p>=1)fin();};
  const up=()=>{if(done)return;cleanup();if(d<8){fin();return;}knob.style.transform='';$('doorLight').style.opacity=.25;};
  const cleanup=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
});

/* ===== v14: 4장 길게 누르기 — 누르는 동안 빛이 차오르고, 떼면 줄어듦 ===== */
let holdWait=null;
function waitHold(ms=1500){
  const box=$('hold'),fg=$('holdFg');box.classList.add('show');let p=0,on=false,last=0,raf=0,buzz=0;
  const paint=()=>{fg.style.strokeDashoffset=264*(1-p);$('crossGlow').style.opacity=p*.9;$('crossGlow').style.transform=`translate(-50%,-50%) scale(${.6+p*.4})`;};
  return new Promise(res=>{
    const step=now=>{const dt=last?now-last:16;last=now;p=Math.max(0,Math.min(1,p+(on?dt/ms:-dt/500)));paint();
      if(on&&now-buzz>220){buzz=now;vib(8+Math.round(p*30));tone(180+p*420,.18,'sine',.04+p*.05);}
      if(p>=1){done();return;}raf=requestAnimationFrame(step);};
    const down=e=>{if(e.target.closest('button,.sheet,.chlist'))return;e.preventDefault();ensureAudio();on=true;box.classList.add('on');};
    const up=()=>{on=false;box.classList.remove('on');};
    const key=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();p=1;}};
    const done=()=>{cancelAnimationFrame(raf);app.removeEventListener('pointerdown',down);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);document.removeEventListener('keydown',key);
      box.classList.remove('show','on');fg.style.strokeDashoffset=264;$('crossGlow').style.opacity='';$('crossGlow').style.transform='';holdWait=null;res();};
    holdWait=done;app.addEventListener('pointerdown',down);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);document.addEventListener('keydown',key);
    raf=requestAnimationFrame(step);});
}

/* ===== v14: 5장 위로 밀어 건너기 — 미는 만큼 다리 위로 걸어감(발소리). 한 번 누르면 저절로 ===== */
let swipeWait=null;
function waitSwipe(){
  const box=$('swipe');box.classList.add('show');
  return new Promise(res=>{
    let sy=0,p=0,steps=0,drag=false,fin=false;
    const set=v=>{p=Math.max(p,Math.min(1,v));zoom(1.05+p*.11,120);const n=Math.floor(p*6);while(steps<n){steps++;tone(steps%2?150:130,.09,'triangle',.07);noise(.05,.12,700,'lowpass');vib(6);}};
    const done=()=>{if(fin)return;fin=true;cleanup();box.classList.remove('show','on');swipeWait=null;res();};
    const auto=()=>{box.classList.add('on');animate(1600,t=>set(p+(1-p)*t)).then(done);};
    const down=e=>{if(e.target.closest('button,.sheet,.chlist'))return;e.preventDefault();ensureAudio();sy=e.clientY;drag=false;box.classList.add('on');
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);};
    const move=e=>{const d=sy-e.clientY;if(Math.abs(d)>8)drag=true;if(d>0)set(d/170);if(p>=1)done();};
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      if(fin)return;if(!drag||p>.35)auto();else box.classList.remove('on');};
    const key=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();auto();}};
    const cleanup=()=>{app.removeEventListener('pointerdown',down);document.removeEventListener('keydown',key);document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);};
    swipeWait=done;app.addEventListener('pointerdown',down);document.addEventListener('keydown',key);
  });
}

/* ===== v14: 6장 조용한 기도 시간 — 숨 고르는 빛과 함께 40초, 끝나면 맑은 소리. 그 뒤 화면을 누름 ===== */

  q.addEventListener('click',sk,{once:true});await c.until(say($('quietTxt'),T.c6x.quiet));

  while(!skip&&performance.now()-t0<QUIET_MS){await c.w(250);bar.style.width=Math.min(100,(performance.now()-t0)/QUIET_MS*100)+'%';}
  q.removeEventListener('click',sk);bar.style.width='100%';
  if(!skip){[523,784].forEach((f,i)=>tone(f,1.6,'sine',.05,null,i*.25));vib(15);$('quietEnd').textContent=T.c6x.quietEnd;await c.tap();}

/* ===== 장 진행 관리 ===== */
let RUN=0,CH=0;const CANCEL={};
function ctl(my){const alive=()=>my===RUN;return{alive,
  w:ms=>wait(ms).then(()=>{if(!alive())throw CANCEL;}),
  until:p=>p.then(v=>{if(!alive())throw CANCEL;return v;}),
  tap:()=>waitTap().then(()=>{if(!alive())throw CANCEL;}),
  /* ms 와 나레이션 중 긴 쪽만큼 기다림 */
  hold:ms=>Promise.all([wait(ms),narrP]).then(()=>{if(!alive())throw CANCEL;})};}
function resetUI(){
  narrStop();capLast='';choiceWait=null;tapWait=null;popWait=null;sheetWait=null;knobWait=null;knocking(false);
  $('tap').classList.remove('show');$('pop').classList.remove('show');closeSheet();panel(null);
  gauge.classList.remove('show','broke','wobble','leak');$('chips').innerHTML='';$('prayer').classList.remove('show');
  knob.classList.remove('show');knob.style.transform='';$('doorLight').style.opacity=0;
  dark(0);tomb(0);cross(null);sin(null);zoom(1,0);$('beam').classList.remove('drop');P.length=0;
  document.querySelectorAll('.sfx').forEach(s=>s.remove());
  clearTimeout(tapTimer);if(holdWait)holdWait();if(swipeWait)swipeWait();$('quiet').classList.remove('show');$('nextSteps').hidden=true;closeChList();
}
const prog=$('prog');
for(let i=1;i<=7;i++){const b=h('button');b.setAttribute('aria-label',STEPS[i]);b.addEventListener('click',e=>{e.stopPropagation();start(i);});prog.appendChild(b);}
function setStep(n){$('stepLabel').textContent=STEPS[n]||'';[...prog.children].forEach((b,i)=>{b.classList.toggle('cur',i+1===n);b.classList.toggle('done',i+1<n);});app.classList.toggle('cover',n===0);}
function start(ch,sub){RUN++;const my=RUN;CH=ch;resetUI();setStep(ch);CHAPTERS[ch](ctl(my),sub).catch(e=>{if(e!==CANCEL)console.error(e);});}

$('resetBtn').addEventListener('click',e=>{e.stopPropagation();ensureAudio();start(CH);});
$('muteBtn').addEventListener('click',e=>{e.stopPropagation();ensureAudio();soundOn=!soundOn;if(!soundOn)narrStop();$('muteBtn').textContent=soundOn?'🔊':'🔇';$('muteBtn').setAttribute('aria-label',soundOn?'소리 끄기':'소리 켜기');});

/* ===== 암송 Festival 에서 덧붙인 것 =====
   ?from=이름 : 링크를 보낸 사람 — 표지에 「○○ 님이 보내 드려요」
   ?in=app    : 암송 Festival 앱 안에서 열었을 때 — 오른쪽 위 ✕ 로 닫고 앱으로 돌아갑니다 */
const QS=new URLSearchParams(location.search);
const FROM=(QS.get('from')||'').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,20);
if(FROM){$('coverFrom').textContent=FROM+' 님이 보내 드려요';$('coverFrom').hidden=false;}
const IN_APP=QS.get('in')==='app';VIEW=IN_APP?'together':'alone';narrOn=VIEW==='alone';paintView();
if(IN_APP){
  const cb=$('closeBtn');cb.hidden=false;
  cb.addEventListener('click',e=>{
    e.stopPropagation();RUN++;resetUI();knocking(false);
    try{if(ac)ac.suspend();}catch(_){}
    if(window.parent!==window){try{parent.postMessage({navfest:'tract-close'},location.origin);}catch(_){}}
    else if(history.length>1)history.back();else location.href='../';
  });
}

start(0);
})();
</script>
